<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Comparativa de simuladores para robótica: Isaac Sim, Gazebo, CoppeliaSim, Webots y RoboDK">
<rect width="1200" height="750" fill="#f6f4ee"/>
<text x="600" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#1e1b15" font-weight="bold">Comparativa de Motores y Entornos de Simulación Robótica</text>
<text x="600" y="78" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#57534a">Fidelidad física, integración ROS 2, renderizado fotorrealista y generación de datos sintéticos</text>

<g transform="translate(60, 110)">
  <rect x="0" y="0" width="1080" height="600" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="2"/>
  
  <!-- 5 Simulator Columns -->
  <!-- Isaac Sim -->
  <g transform="translate(25, 30)">
    <rect x="0" y="0" width="195" height="540" rx="10" fill="#faf7f0" stroke="#76b900" stroke-width="2"/>
    <rect x="0" y="0" width="195" height="45" rx="10" fill="#76b900"/>
    <text x="97" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">NVIDIA Isaac Sim</text>
    
    <text x="12" y="70" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Motor Físico:</text>
    <text x="12" y="88" font-family="Inter, sans-serif" font-size="11" fill="#57534a">PhysX 5 (GPU paralelo)</text>
    
    <text x="12" y="120" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Render:</text>
    <text x="12" y="138" font-family="Inter, sans-serif" font-size="11" fill="#57534a">RTX Ray Tracing (Omniverse)</text>
    
    <text x="12" y="170" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Integración ROS 2:</text>
    <text x="12" y="188" font-family="Inter, sans-serif" font-size="11" fill="#2b8a3e">Excelente (OmniGraph / ROS2 Bridge)</text>
    
    <text x="12" y="225" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Puntos Fuertes:</text>
    <text x="12" y="245" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Reinforcement Learning (Isaac Gym)</text>
    <text x="12" y="280" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Sensores RGB-D / LiDAR realistas</text>
    <text x="12" y="315" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Synthetic Data Generation (SDG)</text>
    
    <rect x="10" y="440" width="175" height="85" rx="6" fill="#ffffff" stroke="#76b900"/>
    <text x="97" y="465" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1e1b15" font-weight="bold">Perfil Ideal:</text>
    <text x="97" y="485" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#57534a">Robótica con IA / Visión</text>
    <text x="97" y="505" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#c92a2a">Requiere GPU RTX &gt;= 8GB</text>
  </g>
  
  <!-- Gazebo Harmonic -->
  <g transform="translate(235, 30)">
    <rect x="0" y="0" width="195" height="540" rx="10" fill="#faf7f0" stroke="#f16529" stroke-width="2"/>
    <rect x="0" y="0" width="195" height="45" rx="10" fill="#f16529"/>
    <text x="97" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">Gazebo (Harmonic)</text>
    
    <text x="12" y="70" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Motor Físico:</text>
    <text x="12" y="88" font-family="Inter, sans-serif" font-size="11" fill="#57534a">DART / Bullet / ODE / TINT</text>
    
    <text x="12" y="120" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Render:</text>
    <text x="12" y="138" font-family="Inter, sans-serif" font-size="11" fill="#57534a">OGRE 2 / Vulkan / OpenGL</text>
    
    <text x="12" y="170" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Integración ROS 2:</text>
    <text x="12" y="188" font-family="Inter, sans-serif" font-size="11" fill="#2b8a3e">Nativa Oficial (ros_gz)</text>
    
    <text x="12" y="225" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Puntos Fuertes:</text>
    <text x="12" y="245" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Estándar en OSRF / MoveIt 2</text>
    <text x="12" y="280" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• 100% Código Abierto (Apache)</text>
    <text x="12" y="315" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Cero costos de licencia</text>
    
    <rect x="10" y="440" width="175" height="85" rx="6" fill="#ffffff" stroke="#f16529"/>
    <text x="97" y="465" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1e1b15" font-weight="bold">Perfil Ideal:</text>
    <text x="97" y="485" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#57534a">Investigación Académica</text>
    <text x="97" y="505" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#2b8a3e">Desarrollo con ROS 2 Control</text>
  </g>
  
  <!-- CoppeliaSim -->
  <g transform="translate(445, 30)">
    <rect x="0" y="0" width="195" height="540" rx="10" fill="#faf7f0" stroke="#2f6fb0" stroke-width="2"/>
    <rect x="0" y="0" width="195" height="45" rx="10" fill="#2f6fb0"/>
    <text x="97" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">CoppeliaSim</text>
    
    <text x="12" y="70" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Motor Físico:</text>
    <text x="12" y="88" font-family="Inter, sans-serif" font-size="11" fill="#57534a">Bullet / ODE / Vortex / Newton</text>
    
    <text x="12" y="120" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Render:</text>
    <text x="12" y="138" font-family="Inter, sans-serif" font-size="11" fill="#57534a">OpenGL clásico funcional</text>
    
    <text x="12" y="170" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Integración ROS 2:</text>
    <text x="12" y="188" font-family="Inter, sans-serif" font-size="11" fill="#57534a">Buena (Plugin ROS2 / ZMQ API)</text>
    
    <text x="12" y="225" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Puntos Fuertes:</text>
    <text x="12" y="245" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Scripts integrados Lua / Python</text>
    <text x="12" y="280" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Cinemática Inversa integrada</text>
    <text x="12" y="315" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Curva de aprendizaje rápida</text>
    
    <rect x="10" y="440" width="175" height="85" rx="6" fill="#ffffff" stroke="#2f6fb0"/>
    <text x="97" y="465" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1e1b15" font-weight="bold">Perfil Ideal:</text>
    <text x="97" y="485" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#57534a">Docencia Universitaria</text>
    <text x="97" y="505" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#2b8a3e">Prototipado cinemático rápido</text>
  </g>
  
  <!-- Webots -->
  <g transform="translate(655, 30)">
    <rect x="0" y="0" width="195" height="540" rx="10" fill="#faf7f0" stroke="#a97b23" stroke-width="2"/>
    <rect x="0" y="0" width="195" height="45" rx="10" fill="#a97b23"/>
    <text x="97" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">Webots</text>
    
    <text x="12" y="70" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Motor Físico:</text>
    <text x="12" y="88" font-family="Inter, sans-serif" font-size="11" fill="#57534a">ODE optimizado Cyberbotics</text>
    
    <text x="12" y="120" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Render:</text>
    <text x="12" y="138" font-family="Inter, sans-serif" font-size="11" fill="#57534a">WREN (OpenGL 3.3)</text>
    
    <text x="12" y="170" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Integración ROS 2:</text>
    <text x="12" y="188" font-family="Inter, sans-serif" font-size="11" fill="#2b8a3e">Oficial (webots_ros2)</text>
    
    <text x="12" y="225" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Puntos Fuertes:</text>
    <text x="12" y="245" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Extremadamente ligero y veloz</text>
    <text x="12" y="280" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Cientos de modelos incluidos</text>
    <text x="12" y="315" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Corre en laptops modestas</text>
    
    <rect x="10" y="440" width="175" height="85" rx="6" fill="#ffffff" stroke="#a97b23"/>
    <text x="97" y="465" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1e1b15" font-weight="bold">Perfil Ideal:</text>
    <text x="97" y="485" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#57534a">Educación Secundaria / Makers</text>
    <text x="97" y="505" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#2b8a3e">Simulación de flotas</text>
  </g>
  
  <!-- RoboDK -->
  <g transform="translate(865, 30)">
    <rect x="0" y="0" width="190" height="540" rx="10" fill="#faf7f0" stroke="#495057" stroke-width="2"/>
    <rect x="0" y="0" width="190" height="45" rx="10" fill="#495057"/>
    <text x="95" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">RoboDK</text>
    
    <text x="12" y="70" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Enfoque:</text>
    <text x="12" y="88" font-family="Inter, sans-serif" font-size="11" fill="#57534a">Offline Programming (OLP)</text>
    
    <text x="12" y="120" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Post-Procesadores:</text>
    <text x="12" y="138" font-family="Inter, sans-serif" font-size="11" fill="#2b8a3e">&gt;900 Robots Industriales (KUKA, ABB, Fanuc, UR)</text>
    
    <text x="12" y="185" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Calibración:</text>
    <text x="12" y="205" font-family="Inter, sans-serif" font-size="11" fill="#2b8a3e">Módulo de calibración ISO 9283</text>
    
    <text x="12" y="240" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">Puntos Fuertes:</text>
    <text x="12" y="260" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• CAD-to-Path (Mecanizado CNC / Soldadura)</text>
    <text x="12" y="305" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Exportación de código nativo</text>
    
    <rect x="10" y="440" width="170" height="85" rx="6" fill="#ffffff" stroke="#495057"/>
    <text x="85" y="465" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1e1b15" font-weight="bold">Perfil Ideal:</text>
    <text x="85" y="485" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#57534a">Integradores Industriales</text>
    <text x="85" y="505" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#c92a2a">Licencia Comercial</text>
  </g>
</g>
</svg>