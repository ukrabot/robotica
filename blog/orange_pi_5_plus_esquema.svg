<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Diagrama de bloques del Orange Pi 5 Plus con el SoC RK3588, la memoria, el almacenamiento, las interfaces de red y las salidas de vídeo">
  <defs>
    <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="1200" height="820" fill="#f6f4ee"/>

  <text x="600" y="55" text-anchor="middle" fill="#1e1b15" font-family="Georgia, serif" font-size="35">Arquitectura del RK3588 en el Orange Pi 5 Plus</text>
  <text x="600" y="88" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="19">Bloques de computo, memoria e interfaces disponibles en la placa</text>

  <!-- SoC central -->
  <rect x="360" y="200" width="480" height="330" rx="16" fill="#23201b" stroke="#0f0d0a" stroke-width="4"/>
  <text x="600" y="242" text-anchor="middle" fill="#e4c07a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">SoC Rockchip RK3588 · 8 nm LP</text>

  <!-- Cluster A76 -->
  <rect x="390" y="266" width="200" height="96" rx="10" fill="#2f6fb0" stroke="#16354f" stroke-width="3"/>
  <text x="490" y="296" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">4x Cortex-A76</text>
  <text x="490" y="320" text-anchor="middle" fill="#dfe8f2" font-family="Inter, Arial, sans-serif" font-size="16">2,4 GHz</text>
  <text x="490" y="344" text-anchor="middle" fill="#dfe8f2" font-family="Inter, Arial, sans-serif" font-size="15">rendimiento · cpu 4-7</text>

  <!-- Cluster A55 -->
  <rect x="610" y="266" width="200" height="96" rx="10" fill="#3f5f80" stroke="#16354f" stroke-width="3"/>
  <text x="710" y="296" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">4x Cortex-A55</text>
  <text x="710" y="320" text-anchor="middle" fill="#dfe8f2" font-family="Inter, Arial, sans-serif" font-size="16">1,8 GHz</text>
  <text x="710" y="344" text-anchor="middle" fill="#dfe8f2" font-family="Inter, Arial, sans-serif" font-size="15">eficiencia · cpu 0-3</text>

  <!-- GPU -->
  <rect x="390" y="380" width="200" height="80" rx="10" fill="#a97b23" stroke="#7a5715" stroke-width="3"/>
  <text x="490" y="410" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">GPU Mali-G610</text>
  <text x="490" y="436" text-anchor="middle" fill="#f6ead2" font-family="Inter, Arial, sans-serif" font-size="15">OpenCL 2.2 · Vulkan 1.2</text>

  <!-- NPU -->
  <rect x="610" y="380" width="200" height="80" rx="10" fill="#3f7a2e" stroke="#2f5c22" stroke-width="3"/>
  <text x="710" y="410" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">NPU 6 TOPS</text>
  <text x="710" y="436" text-anchor="middle" fill="#e6f2e2" font-family="Inter, Arial, sans-serif" font-size="15">3 nucleos · INT4/8/16, FP16</text>

  <!-- VPU -->
  <rect x="390" y="478" width="420" height="38" rx="8" fill="#3a352c" stroke="#0f0d0a" stroke-width="3"/>
  <text x="600" y="503" text-anchor="middle" fill="#c9c4b8" font-family="Inter, Arial, sans-serif" font-size="16">VPU: codificacion H.264 y H.265 · decodificacion 8K y AV1</text>

  <!-- Memoria (izquierda arriba) -->
  <rect x="60" y="200" width="250" height="96" rx="12" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
  <text x="185" y="232" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600">Memoria LPDDR4x</text>
  <text x="185" y="258" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="16">4, 8 o 16 GB</text>
  <text x="185" y="282" text-anchor="middle" fill="#8b8577" font-family="Inter, Arial, sans-serif" font-size="15">16 GB recomendado para IA</text>

  <!-- Almacenamiento -->
  <rect x="60" y="320" width="250" height="210" rx="12" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
  <text x="185" y="352" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600">Almacenamiento</text>
  <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#57534a">
    <text x="84" y="386">QSPI NOR 16 / 32 MB</text>
    <text x="84" y="414">microSD hasta 128 GB</text>
    <text x="84" y="442">Socket eMMC 16 a 256 GB</text>
    <text x="84" y="470" fill="#2f5c22" font-weight="600">M.2 2280 NVMe (PCIe)</text>
    <text x="84" y="498">M.2 E-Key para Wi-Fi</text>
  </g>

  <!-- Red -->
  <rect x="890" y="200" width="250" height="130" rx="12" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
  <text x="1015" y="232" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600">Red</text>
  <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#57534a">
    <text x="914" y="266">2x 2,5 GbE RTL8125BG</text>
    <text x="914" y="294">Enrutado, bonding o NAS</text>
    <text x="914" y="320" fill="#8b8577">Wi-Fi opcional por M.2 E-Key</text>
  </g>

  <!-- Video -->
  <rect x="890" y="352" width="250" height="178" rx="12" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
  <text x="1015" y="384" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600">Video y E/S</text>
  <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#57534a">
    <text x="914" y="418">HDMI 2.1 salida hasta 8K</text>
    <text x="914" y="446">Entrada HDMI</text>
    <text x="914" y="474">DisplayPort por USB-C</text>
    <text x="914" y="502">GPIO de 40 pines</text>
  </g>

  <!-- Conexiones -->
  <g stroke="#3a3a3a" stroke-width="4" fill="none" marker-end="url(#ar)">
    <path d="M 310 248 L 354 248"/>
    <path d="M 310 420 L 354 420"/>
    <path d="M 840 262 L 884 262"/>
    <path d="M 840 420 L 884 420"/>
  </g>

  <!-- Franja inferior: alimentacion y termica -->
  <rect x="60" y="570" width="520" height="190" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
  <text x="320" y="606" text-anchor="middle" fill="#1e1b15" font-family="Georgia, serif" font-size="24">Alimentacion</text>
  <rect x="90" y="624" width="460" height="40" rx="8" fill="#fdf1ef" stroke="#b2281e" stroke-width="3"/>
  <text x="320" y="651" text-anchor="middle" fill="#7a1c14" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">USB-C 5 V / 4 A  ·  20 W minimo</text>
  <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#57534a">
    <text x="90" y="694">Una fuente insuficiente provoca reinicios aleatorios,</text>
    <text x="90" y="720">perdida de la unidad NVMe y corrupcion de archivos.</text>
    <text x="90" y="746" fill="#8b8577">Usa cable corto y de calibre grueso: la caida importa.</text>
  </g>

  <rect x="620" y="570" width="520" height="190" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
  <text x="880" y="606" text-anchor="middle" fill="#1e1b15" font-family="Georgia, serif" font-size="24">Termica</text>
  <g font-family="Inter, Arial, sans-serif" font-size="16">
    <rect x="650" y="624" width="220" height="36" rx="6" fill="#fdf1ef" stroke="#b2281e" stroke-width="2"/>
    <text x="666" y="648" fill="#7a1c14">Sin disipador: 85 a 95 C</text>
    <rect x="890" y="624" width="220" height="36" rx="6" fill="#fdf1ef" stroke="#b2281e" stroke-width="2"/>
    <text x="906" y="648" fill="#b2281e">rinde 40 a 55 %</text>

    <rect x="650" y="670" width="220" height="36" rx="6" fill="#fdf9ef" stroke="#a97b23" stroke-width="2"/>
    <text x="666" y="694" fill="#7a5715">Pasivo grande: 65 a 75 C</text>
    <rect x="890" y="670" width="220" height="36" rx="6" fill="#fdf9ef" stroke="#a97b23" stroke-width="2"/>
    <text x="906" y="694" fill="#a97b23">rinde 85 a 95 %</text>

    <rect x="650" y="716" width="220" height="36" rx="6" fill="#f0f6ef" stroke="#3f7a2e" stroke-width="2"/>
    <text x="666" y="740" fill="#2f5c22">Con ventilador: 45 a 58 C</text>
    <rect x="890" y="716" width="220" height="36" rx="6" fill="#f0f6ef" stroke="#3f7a2e" stroke-width="2"/>
    <text x="906" y="740" fill="#3f7a2e">rinde 100 %</text>
  </g>

  <text x="600" y="790" text-anchor="middle" fill="#8b8577" font-family="Inter, Arial, sans-serif" font-size="16">La NPU exige conversion previa de los modelos a formato RKNN en un equipo x86: no acelera ONNX ni PyTorch directamente.</text>
</svg>
