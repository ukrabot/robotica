<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Ilustración de la placa Orange Pi 5 Plus con el SoC Rockchip RK3588, dos puertos de red de 2,5 gigabit y una unidad NVMe M punto 2 instalada">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141210"/>
      <stop offset="1" stop-color="#211b14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e4c07a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e4c07a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fb0"/>
      <stop offset="1" stop-color="#1f4e7f"/>
    </linearGradient>
    <linearGradient id="soc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a352c"/>
      <stop offset="1" stop-color="#1b1813"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="340" r="290" fill="url(#glow)"/>

  <text x="600" y="55" text-anchor="middle" fill="#e4c07a" font-family="Georgia, serif" font-size="34">Orange Pi 5 Plus · Rockchip RK3588</text>

  <!-- Placa -->
  <g transform="translate(180 120)">
    <rect x="0" y="0" width="840" height="400" rx="18" fill="url(#board)" stroke="#16354f" stroke-width="5"/>

    <!-- Agujeros de montaje -->
    <g fill="#141210" stroke="#c9c4b8" stroke-width="3">
      <circle cx="30" cy="30" r="11"/>
      <circle cx="810" cy="30" r="11"/>
      <circle cx="30" cy="370" r="11"/>
      <circle cx="810" cy="370" r="11"/>
    </g>

    <!-- SoC -->
    <g transform="translate(300 130)">
      <rect x="0" y="0" width="180" height="150" rx="8" fill="url(#soc)" stroke="#0f0d0a" stroke-width="4"/>
      <rect x="16" y="16" width="148" height="118" rx="4" fill="none" stroke="#57534a" stroke-width="2"/>
      <text x="90" y="62" text-anchor="middle" fill="#e4c07a" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">RK3588</text>
      <text x="90" y="90" text-anchor="middle" fill="#c9c4b8" font-family="Inter, Arial, sans-serif" font-size="16">8 nm  ·  8 nucleos</text>
      <text x="90" y="116" text-anchor="middle" fill="#7ad46a" font-family="Inter, Arial, sans-serif" font-size="16">NPU 6 TOPS</text>
    </g>

    <!-- Memorias -->
    <rect x="180" y="150" width="86" height="110" rx="6" fill="#23201b" stroke="#0f0d0a" stroke-width="3"/>
    <text x="223" y="200" text-anchor="middle" fill="#c9c4b8" font-family="Inter, Arial, sans-serif" font-size="15">LPDDR4x</text>
    <text x="223" y="224" text-anchor="middle" fill="#e4c07a" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">16 GB</text>

    <rect x="514" y="150" width="86" height="110" rx="6" fill="#23201b" stroke="#0f0d0a" stroke-width="3"/>
    <text x="557" y="200" text-anchor="middle" fill="#c9c4b8" font-family="Inter, Arial, sans-serif" font-size="15">PMU</text>
    <text x="557" y="224" text-anchor="middle" fill="#c9c4b8" font-family="Inter, Arial, sans-serif" font-size="15">RK806-1</text>

    <!-- GPIO 40 pines -->
    <g fill="#e8d9b6">
      <rect x="180" y="40" width="420" height="16" rx="3"/>
    </g>
    <g fill="#3a352c">
      <rect x="186" y="43" width="6" height="10"/>
      <rect x="206" y="43" width="6" height="10"/>
      <rect x="226" y="43" width="6" height="10"/>
      <rect x="246" y="43" width="6" height="10"/>
      <rect x="266" y="43" width="6" height="10"/>
      <rect x="286" y="43" width="6" height="10"/>
      <rect x="306" y="43" width="6" height="10"/>
      <rect x="326" y="43" width="6" height="10"/>
      <rect x="346" y="43" width="6" height="10"/>
      <rect x="366" y="43" width="6" height="10"/>
      <rect x="386" y="43" width="6" height="10"/>
      <rect x="406" y="43" width="6" height="10"/>
      <rect x="426" y="43" width="6" height="10"/>
      <rect x="446" y="43" width="6" height="10"/>
      <rect x="466" y="43" width="6" height="10"/>
      <rect x="486" y="43" width="6" height="10"/>
      <rect x="506" y="43" width="6" height="10"/>
      <rect x="526" y="43" width="6" height="10"/>
      <rect x="546" y="43" width="6" height="10"/>
      <rect x="566" y="43" width="6" height="10"/>
    </g>
    <text x="390" y="82" text-anchor="middle" fill="#dfe8f2" font-family="Inter, Arial, sans-serif" font-size="16">GPIO 40 pines</text>

    <!-- NVMe M.2 -->
    <g transform="translate(180 300)">
      <rect x="0" y="0" width="420" height="60" rx="6" fill="#1b3552" stroke="#0f2438" stroke-width="3"/>
      <rect x="14" y="12" width="360" height="36" rx="4" fill="#2c2823" stroke="#0f0d0a" stroke-width="2"/>
      <rect x="30" y="22" width="60" height="18" rx="2" fill="#57534a"/>
      <rect x="102" y="22" width="60" height="18" rx="2" fill="#57534a"/>
      <rect x="174" y="22" width="60" height="18" rx="2" fill="#57534a"/>
      <text x="300" y="36" text-anchor="middle" fill="#e4c07a" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">NVMe M.2 2280</text>
      <rect x="384" y="18" width="22" height="24" rx="3" fill="#8b8577"/>
    </g>

    <!-- Puertos ethernet -->
    <g transform="translate(636 130)">
      <rect x="0" y="0" width="90" height="80" rx="6" fill="#3a352c" stroke="#0f0d0a" stroke-width="3"/>
      <rect x="18" y="16" width="54" height="46" rx="4" fill="#141210"/>
      <rect x="34" y="8" width="22" height="14" rx="2" fill="#141210"/>
      <circle cx="30" cy="72" r="4" fill="#7ad46a"/>
      <circle cx="60" cy="72" r="4" fill="#e4c07a"/>

      <rect x="0" y="94" width="90" height="80" rx="6" fill="#3a352c" stroke="#0f0d0a" stroke-width="3"/>
      <rect x="18" y="110" width="54" height="46" rx="4" fill="#141210"/>
      <rect x="34" y="102" width="22" height="14" rx="2" fill="#141210"/>
      <circle cx="30" cy="166" r="4" fill="#7ad46a"/>
      <circle cx="60" cy="166" r="4" fill="#e4c07a"/>
    </g>
    <text x="681" y="240" text-anchor="middle" fill="#dfe8f2" font-family="Inter, Arial, sans-serif" font-size="16">2x 2,5 GbE</text>

    <!-- USB-C y HDMI -->
    <g transform="translate(636 300)">
      <rect x="0" y="10" width="60" height="24" rx="12" fill="#3a352c" stroke="#0f0d0a" stroke-width="3"/>
      <rect x="0" y="44" width="90" height="26" rx="4" fill="#3a352c" stroke="#0f0d0a" stroke-width="3"/>
    </g>
    <text x="700" y="386" text-anchor="middle" fill="#dfe8f2" font-family="Inter, Arial, sans-serif" font-size="15">USB-C 5 V/4 A  ·  HDMI 2.1</text>
  </g>

  <!-- Etiquetas -->
  <g font-family="Inter, Arial, sans-serif" font-size="19" fill="#8b8577" text-anchor="middle">
    <text x="290" y="580">4x Cortex-A76 @ 2,4 GHz</text>
    <text x="600" y="580">4x Cortex-A55 @ 1,8 GHz</text>
    <text x="910" y="580">GPU Mali-G610</text>
  </g>
</svg>
