<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Esquema de un crossover pasivo de 2 vías de segundo orden Linkwitz-Riley a 2 kHz para 8 ohm">
  <rect width="1200" height="820" fill="#f6f4ee"/>
  <text x="600" y="60" text-anchor="middle" fill="#1e1b15" font-family="Georgia, serif" font-size="36">Crossover Pasivo de 2 Vías — 2º Orden (Linkwitz-Riley), 2 kHz, 8 Ω</text>

  <!-- Entrada -->
  <g transform="translate(60 330)">
    <rect x="0" y="0" width="160" height="140" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <text x="80" y="50" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">Amplificador</text>
    <text x="80" y="85" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="19">(+)</text>
    <text x="80" y="120" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="19">(−)</text>
  </g>

  <!-- Rama de graves -->
  <g transform="translate(300 120)">
    <rect x="0" y="0" width="780" height="260" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <text x="390" y="38" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Rama de graves (pasabajos)</text>
    <g font-family="Inter, Arial, sans-serif" font-size="22" fill="#1e1b15">
      <circle cx="90" cy="130" r="34" fill="none" stroke="#a97b23" stroke-width="4"/>
      <text x="90" y="140" text-anchor="middle">L1</text>
      <text x="200" y="80" text-anchor="middle" fill="#57534a" font-size="18">3,2 mH</text>
      <circle cx="330" cy="130" r="34" fill="none" stroke="#2f6fb0" stroke-width="4"/>
      <text x="330" y="140" text-anchor="middle">C1</text>
      <text x="330" y="70" text-anchor="middle" fill="#57534a" font-size="18">20 µF</text>
      <rect x="560" y="100" width="90" height="60" rx="8" fill="#23201b"/>
      <text x="605" y="137" text-anchor="middle" fill="#e4c07a" font-size="20">Woofer</text>
      <text x="605" y="230" text-anchor="middle" fill="#57534a" font-size="18">8 Ω · polo positivo arriba</text>
    </g>
    <!-- lineas de conexion -->
    <g stroke="#3a3a3a" stroke-width="4">
      <line x1="0" y1="60" x2="124" y2="60"/>
      <line x1="124" y1="60" x2="124" y2="96"/>
      <line x1="124" y1="96" x2="56" y2="96"/>
      <line x1="56" y1="60" x2="56" y2="110"/>
      <circle cx="90" cy="110" r="2" fill="#3a3a3a"/>
      <line x1="124" y1="96" x2="296" y2="96"/>
      <line x1="296" y1="96" x2="296" y2="110"/>
      <circle cx="330" cy="110" r="2" fill="#3a3a3a"/>
      <line x1="330" y1="96" x2="560" y2="96"/>
      <line x1="560" y1="96" x2="560" y2="100"/>
      <line x1="0" y1="200" x2="605" y2="200"/>
      <line x1="605" y1="200" x2="605" y2="160"/>
    </g>
  </g>

  <!-- Rama de agudos -->
  <g transform="translate(300 450)">
    <rect x="0" y="0" width="780" height="260" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <text x="390" y="38" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Rama de agudos (pasaaltos)</text>
    <g font-family="Inter, Arial, sans-serif" font-size="22" fill="#1e1b15">
      <circle cx="90" cy="130" r="34" fill="none" stroke="#2f6fb0" stroke-width="4"/>
      <text x="90" y="140" text-anchor="middle">C2</text>
      <text x="90" y="70" text-anchor="middle" fill="#57534a" font-size="18">10 µF</text>
      <circle cx="330" cy="130" r="34" fill="none" stroke="#a97b23" stroke-width="4"/>
      <text x="330" y="140" text-anchor="middle">L2</text>
      <text x="330" y="80" text-anchor="middle" fill="#57534a" font-size="18">1,6 mH</text>
      <rect x="560" y="100" width="90" height="60" rx="8" fill="#23201b"/>
      <text x="605" y="137" text-anchor="middle" fill="#e4c07a" font-size="20">Tweeter</text>
      <text x="605" y="230" text-anchor="middle" fill="#57534a" font-size="18">8 Ω · conexión en fase</text>
    </g>
    <g stroke="#3a3a3a" stroke-width="4">
      <line x1="0" y1="60" x2="56" y2="60"/>
      <line x1="56" y1="60" x2="56" y2="96"/>
      <line x1="56" y1="96" x2="124" y2="96"/>
      <circle cx="90" cy="110" r="2" fill="#3a3a3a"/>
      <line x1="124" y1="96" x2="296" y2="96"/>
      <line x1="296" y1="96" x2="296" y2="110"/>
      <circle cx="330" cy="110" r="2" fill="#3a3a3a"/>
      <line x1="330" y1="96" x2="560" y2="96"/>
      <line x1="560" y1="96" x2="560" y2="100"/>
      <line x1="0" y1="200" x2="605" y2="200"/>
      <line x1="605" y1="200" x2="605" y2="160"/>
    </g>
  </g>

  <!-- Conexion de entrada -->
  <g stroke="#3a3a3a" stroke-width="5">
    <path d="M 220 370 C 270 370 270 240 300 240" fill="none"/>
    <path d="M 220 430 C 280 430 280 570 300 570" fill="none"/>
  </g>
  <text x="235" y="330" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="19">+ amplificador</text>
  <text x="235" y="480" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="19">− amplificador</text>

  <text x="600" y="790" text-anchor="middle" fill="#8b8577" font-family="Inter, Arial, sans-serif" font-size="18">Fórmulas (8 Ω, 2 kHz): L = R/(2π·f) = 0,64 mH por sección de 1er orden; C = 1/(2π·f·R) = 10 µF. Valores mostrados = 2º orden LR2.</text>
</svg>
