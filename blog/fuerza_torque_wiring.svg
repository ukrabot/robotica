<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Diagrama de conexión de un sensor de fuerza-torque a un Arduino">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6fb0"/>
      <stop offset="1" stop-color="#1f4e7f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="820" fill="#f6f4ee"/>
  <text x="600" y="58" text-anchor="middle" fill="#1e1b15" font-family="Georgia, serif" font-size="36">Conexión de un Sensor de Fuerza-Torque a Arduino</text>

  <!-- Sensor F/T -->
  <g transform="translate(120 130)">
    <rect x="0" y="0" width="320" height="300" rx="16" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <rect x="90" y="30" width="140" height="140" rx="20" fill="#c9d1da" stroke="#7a838d" stroke-width="3"/>
    <g stroke="#7a838d" stroke-width="2" fill="none">
      <rect x="118" y="58" width="84" height="84" rx="12"/>
      <path d="M 118 100 L 202 100"/>
      <path d="M 160 58 L 160 142"/>
    </g>
    <circle cx="160" cy="100" r="12" fill="#5c636c"/>
    <text x="160" y="240" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">Sensor F/T</text>
    <g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">
      <rect x="30" y="265" width="60" height="28" rx="5" fill="#b04a3a"/><text x="60" y="284" text-anchor="middle" fill="#fff">VCC</text>
      <rect x="100" y="265" width="60" height="28" rx="5" fill="#3a3a3a"/><text x="130" y="284" text-anchor="middle" fill="#fff">GND</text>
      <rect x="170" y="265" width="60" height="28" rx="5" fill="#2f6fb0"/><text x="200" y="284" text-anchor="middle" fill="#fff">Fx</text>
      <rect x="240" y="265" width="60" height="28" rx="5" fill="#2f6fb0"/><text x="270" y="284" text-anchor="middle" fill="#fff">Fz</text>
    </g>
  </g>

  <!-- Placa Arduino -->
  <g transform="translate(650 130)">
    <rect x="0" y="0" width="440" height="300" rx="14" fill="url(#board)" stroke="#16354f" stroke-width="3"/>
    <g fill="#e8e2d4">
      <rect x="330" y="24" width="26" height="12" rx="2"/>
      <rect x="366" y="24" width="26" height="12" rx="2"/>
      <rect x="330" y="48" width="26" height="12" rx="2"/>
      <rect x="366" y="48" width="26" height="12" rx="2"/>
    </g>
    <g font-family="Inter, Arial, sans-serif" font-size="20" fill="#ffffff">
      <text x="150" y="40">5V</text>
      <text x="150" y="90">GND</text>
      <text x="150" y="140">A0 (Fx)</text>
      <text x="150" y="190">A1 (Fz)</text>
    </g>
    <rect x="30" y="250" width="40" height="30" rx="6" fill="#e8d9b6"/>
    <text x="220" y="170" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">Arduino</text>
  </g>

  <!-- Cables -->
  <g stroke-linecap="round" fill="none">
    <path d="M 220 300 C 320 300 320 155 650 155" stroke="#b04a3a" stroke-width="7"/>
    <path d="M 290 300 C 400 300 400 205 650 205" stroke="#3a3a3a" stroke-width="7"/>
    <path d="M 260 300 C 360 300 360 260 650 260" stroke="#2f6fb0" stroke-width="7"/>
    <path d="M 330 300 C 430 300 430 270 650 270" stroke="#2f6fb0" stroke-width="7"/>
  </g>

  <!-- Etiquetas de cables -->
  <g font-family="Inter, Arial, sans-serif" font-size="20" fill="#57534a">
    <text x="350" y="148">VCC → 5V</text>
    <text x="350" y="200">GND → GND</text>
    <text x="350" y="253">Fx → A0</text>
    <text x="350" y="295">Fz → A1</text>
  </g>

  <!-- Bloque de explicación -->
  <g transform="translate(120 560)">
    <rect x="0" y="0" width="970" height="180" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <text x="485" y="40" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Interpretación de lecturas</text>
    <g font-family="Inter, Arial, sans-serif" font-size="18" fill="#57534a">
      <text x="40" y="80">1. Mide la lectura con el sensor en reposo (offset o cero).</text>
      <text x="40" y="110">2. Aplica una fuerza conocida y registra el cambio de lectura.</text>
      <text x="40" y="140">3. Escala: valor = (lectura − offset) × factor de calibración.</text>
    </g>
  </g>

  <text x="600" y="790" text-anchor="middle" fill="#8b8577" font-family="Inter, Arial, sans-serif" font-size="18">El sensor F/T entrega señales analógicas proporcionales a cada eje de fuerza; se leen con analogRead y se calibran con un offset.</text>
</svg>
