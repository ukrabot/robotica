<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Arquitectura de un NAS con Raspberry Pi: clientes en red Gigabit, la placa con Samba y NFS, el bus USB 3.0 compartido y dos discos con alimentación externa">
  <rect width="1200" height="820" fill="#f6f4ee"/>
  <text x="600" y="54" text-anchor="middle" fill="#1e1b15" font-family="Georgia, serif" font-size="34">Arquitectura de un NAS con Raspberry Pi</text>
  <text x="600" y="86" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="18">Dónde están los cuellos de botella reales</text>

  <g font-family="Inter, Arial, sans-serif">
    <!-- Clientes -->
    <g transform="translate(60 120)">
      <rect x="0" y="0" width="1080" height="110" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
      <text x="540" y="34" text-anchor="middle" fill="#1e1b15" font-size="20" font-weight="700">Clientes de la red local</text>
      <g>
        <rect x="70" y="50" width="180" height="44" rx="9" fill="#faf7f0" stroke="#c9c4b8" stroke-width="2"/>
        <text x="160" y="78" text-anchor="middle" fill="#1e1b15" font-size="16">Windows · SMB3</text>
        <rect x="290" y="50" width="180" height="44" rx="9" fill="#faf7f0" stroke="#c9c4b8" stroke-width="2"/>
        <text x="380" y="78" text-anchor="middle" fill="#1e1b15" font-size="16">macOS · SMB3</text>
        <rect x="510" y="50" width="180" height="44" rx="9" fill="#faf7f0" stroke="#c9c4b8" stroke-width="2"/>
        <text x="600" y="78" text-anchor="middle" fill="#1e1b15" font-size="16">Linux · NFS</text>
        <rect x="730" y="50" width="180" height="44" rx="9" fill="#faf7f0" stroke="#c9c4b8" stroke-width="2"/>
        <text x="820" y="78" text-anchor="middle" fill="#1e1b15" font-size="16">Móvil · SMB</text>
      </g>
    </g>

    <!-- Red -->
    <line x1="600" y1="230" x2="600" y2="278" stroke="#2f6fb0" stroke-width="6"/>
    <rect x="410" y="278" width="380" height="52" rx="10" fill="#2f6fb0"/>
    <text x="600" y="311" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="600">Ethernet Gigabit · techo ≈ 112 MB/s</text>
    <line x1="600" y1="330" x2="600" y2="378" stroke="#2f6fb0" stroke-width="6"/>

    <!-- Raspberry Pi -->
    <g transform="translate(300 378)">
      <rect x="0" y="0" width="600" height="180" rx="16" fill="#23201b"/>
      <text x="300" y="40" text-anchor="middle" fill="#e4c07a" font-size="23" font-weight="700">Raspberry Pi 4 / 5</text>
      <rect x="40" y="60" width="240" height="46" rx="9" fill="#332e26"/>
      <text x="160" y="90" text-anchor="middle" fill="#e8e2d4" font-size="16">Samba (smbd)</text>
      <rect x="320" y="60" width="240" height="46" rx="9" fill="#332e26"/>
      <text x="440" y="90" text-anchor="middle" fill="#e8e2d4" font-size="16">NFS kernel server</text>
      <rect x="40" y="118" width="520" height="42" rx="9" fill="#332e26"/>
      <text x="300" y="145" text-anchor="middle" fill="#c9b48a" font-size="16">ext4 · montaje por UUID en fstab con noatime y nofail</text>
    </g>

    <!-- USB bus -->
    <line x1="600" y1="558" x2="600" y2="596" stroke="#a97b23" stroke-width="6"/>
    <rect x="360" y="596" width="480" height="50" rx="10" fill="#a97b23"/>
    <text x="600" y="628" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="600">Bus USB 3.0 compartido entre ambos discos</text>

    <!-- Discos -->
    <g>
      <line x1="600" y1="646" x2="330" y2="686" stroke="#3a3a3a" stroke-width="4"/>
      <line x1="600" y1="646" x2="870" y2="686" stroke="#3a3a3a" stroke-width="4"/>

      <g transform="translate(140 686)">
        <rect x="0" y="0" width="380" height="96" rx="12" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
        <text x="190" y="34" text-anchor="middle" fill="#1e1b15" font-size="19" font-weight="600">Disco 1 · datos</text>
        <text x="190" y="60" text-anchor="middle" fill="#57534a" font-size="16">3,5" con fuente propia</text>
        <text x="190" y="83" text-anchor="middle" fill="#7a1c14" font-size="15" font-weight="600">Nunca alimentar desde la Pi</text>
      </g>

      <g transform="translate(680 686)">
        <rect x="0" y="0" width="380" height="96" rx="12" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
        <text x="190" y="34" text-anchor="middle" fill="#1e1b15" font-size="19" font-weight="600">Disco 2 · respaldo</text>
        <text x="190" y="60" text-anchor="middle" fill="#57534a" font-size="16">rsync nocturno con papelera</text>
        <text x="190" y="83" text-anchor="middle" fill="#2f5c22" font-size="15" font-weight="600">Ventana de 24 h ante borrados</text>
      </g>
    </g>
  </g>
</svg>
