<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Ilustración de un sensor de fuerza-torque de 6 ejes montado en la muñeca de un brazo robótico">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141210"/>
      <stop offset="1" stop-color="#211b14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e4c07a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e4c07a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a939e"/>
      <stop offset="0.5" stop-color="#5c636c"/>
      <stop offset="1" stop-color="#3a4047"/>
    </linearGradient>
    <linearGradient id="ftbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d1da"/>
      <stop offset="1" stop-color="#7a838d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="330" r="250" fill="url(#glow)"/>

  <!-- Brazo (antebrazo) -->
  <g>
    <rect x="80" y="180" width="380" height="120" rx="16" fill="url(#metal)" stroke="#2a2f35" stroke-width="3"/>
    <rect x="80" y="205" width="380" height="14" rx="7" fill="#3a4047"/>
    <rect x="80" y="260" width="380" height="14" rx="7" fill="#3a4047"/>
  </g>

  <!-- Muñeca / brida -->
  <g transform="translate(470 180)">
    <rect x="0" y="0" width="120" height="120" rx="14" fill="#4a525c" stroke="#2a2f35" stroke-width="3"/>
    <circle cx="60" cy="60" r="30" fill="#2a2f35"/>
    <circle cx="60" cy="60" r="18" fill="#141210"/>
  </g>

  <!-- Sensor F/T (cilindro con placa) -->
  <g transform="translate(590 170)">
    <rect x="0" y="0" width="140" height="140" rx="20" fill="url(#ftbody)" stroke="#4a525c" stroke-width="3"/>
    <!-- ranuras de strain gauges -->
    <g stroke="#4a525c" stroke-width="3" fill="none">
      <rect x="28" y="28" width="84" height="84" rx="12"/>
      <path d="M 28 70 L 112 70"/>
      <path d="M 70 28 L 70 112"/>
    </g>
    <!-- orificios de montaje -->
    <circle cx="70" cy="70" r="12" fill="#2a2f35"/>
    <circle cx="20" cy="20" r="5" fill="#2a2f35"/>
    <circle cx="120" cy="20" r="5" fill="#2a2f35"/>
    <circle cx="20" cy="120" r="5" fill="#2a2f35"/>
    <circle cx="120" cy="120" r="5" fill="#2a2f35"/>
  </g>

  <!-- Pinza / efector -->
  <g transform="translate(730 170)">
    <rect x="0" y="0" width="120" height="120" rx="14" fill="#4a525c" stroke="#2a2f35" stroke-width="3"/>
    <path d="M 20 120 L 30 200 Q 60 210 90 200 L 100 120" fill="#5c636c" stroke="#2a2f35" stroke-width="3"/>
    <path d="M 35 120 L 40 180" stroke="#2a2f35" stroke-width="3" fill="none"/>
    <path d="M 85 120 L 80 180" stroke="#2a2f35" stroke-width="3" fill="none"/>
  </g>

  <!-- Ejes de fuerza/torque -->
  <g stroke="#e4c07a" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M 0 0 L 8 3 L 0 6 Z" fill="#e4c07a"/>
      </marker>
    </defs>
    <line x1="660" y1="360" x2="660" y2="470"/>
    <line x1="660" y1="360" x2="770" y2="360"/>
  </g>
  <text x="690" y="500" fill="#e4c07a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Fz</text>
  <text x="790" y="368" fill="#e4c07a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Fx</text>

  <!-- Flechas de torque -->
  <g stroke="#2f6fb0" stroke-width="4" fill="none">
    <path d="M 610 150 A 90 90 0 0 1 760 150" marker-end="url(#arrow2)"/>
    <defs>
      <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M 0 0 L 8 3 L 0 6 Z" fill="#2f6fb0"/>
      </marker>
    </defs>
  </g>
  <text x="700" y="120" fill="#2f6fb0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">Mx (torque)</text>

  <text x="600" y="60" text-anchor="middle" fill="#e4c07a" font-family="Georgia, serif" font-size="34">Sensor de Fuerza-Torque de 6 Ejes</text>
  <text x="600" y="600" text-anchor="middle" fill="rgba(245,243,238,.55)" font-family="Inter, Arial, sans-serif" font-size="18">Mide fuerzas (Fx, Fy, Fz) y torques (Mx, My, Mz) en la muñeca del robot.</text>
</svg>
