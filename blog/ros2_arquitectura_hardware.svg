<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Arquitectura de hardware de un robot con ROS 2: computadora principal con nodos de percepción y navegación, microcontrolador con micro-ROS para el control de bajo nivel, sensores y actuadores">
<rect width="1200" height="820" fill="#f6f4ee"/>
<text x="600" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#1e1b15">Arquitectura de hardware de un robot con ROS 2</text>
<text x="600" y="84" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#57534a">Cómputo en la SBC, tiempo real en el microcontrolador, seguridad en circuito cableado</text>

<rect x="55" y="115" width="330" height="290" rx="14" fill="#ffffff" stroke="#2f6fb0" stroke-width="3"/>
<text x="220" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#2f6fb0" font-weight="bold">Sensores</text>
<rect x="85" y="168" width="270" height="46" rx="8" fill="#eef3f9" stroke="#2f6fb0" stroke-width="2"/>
<text x="220" y="190" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1e1b15">LiDAR 2D · RPLIDAR A1 / LD19</text>
<text x="220" y="207" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8b8577">USB serie · /scan</text>
<rect x="85" y="222" width="270" height="46" rx="8" fill="#eef3f9" stroke="#2f6fb0" stroke-width="2"/>
<text x="220" y="244" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1e1b15">Cámara de profundidad · D435i</text>
<text x="220" y="261" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8b8577">USB 3.0 · /camera/depth</text>
<rect x="85" y="276" width="270" height="46" rx="8" fill="#eef3f9" stroke="#2f6fb0" stroke-width="2"/>
<text x="220" y="298" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1e1b15">IMU · BNO085</text>
<text x="220" y="315" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8b8577">I²C · /imu/data</text>
<rect x="85" y="330" width="270" height="46" rx="8" fill="#f6f4ee" stroke="#8b8577" stroke-width="2"/>
<text x="220" y="352" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1e1b15">Encoders en ruedas</text>
<text x="220" y="369" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8b8577">al microcontrolador, no a la SBC</text>

<rect x="435" y="115" width="330" height="290" rx="14" fill="#ffffff" stroke="#a97b23" stroke-width="4"/>
<text x="600" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#a97b23" font-weight="bold">Computadora principal</text>
<text x="600" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#8b8577">Ubuntu 24.04 · ROS 2 Jazzy</text>
<rect x="465" y="186" width="270" height="40" rx="8" fill="#23201b"/>
<text x="600" y="212" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#e4c07a">Nav2 — planificación y navegación</text>
<rect x="465" y="232" width="270" height="40" rx="8" fill="#23201b"/>
<text x="600" y="258" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#e4c07a">slam_toolbox — mapa y localización</text>
<rect x="465" y="278" width="270" height="40" rx="8" fill="#23201b"/>
<text x="600" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#e4c07a">robot_localization — fusión EKF</text>
<rect x="465" y="324" width="270" height="40" rx="8" fill="#a97b23"/>
<text x="600" y="350" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="bold">micro_ros_agent</text>
<text x="600" y="386" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#b2281e">Sin garantía de tiempo real duro</text>

<rect x="815" y="115" width="330" height="290" rx="14" fill="#ffffff" stroke="#3f7a2e" stroke-width="3"/>
<text x="980" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#3f7a2e" font-weight="bold">Estación base</text>
<rect x="845" y="168" width="270" height="46" rx="8" fill="#f0f6ef" stroke="#3f7a2e" stroke-width="2"/>
<text x="980" y="197" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1e1b15">RViz2 · visualización</text>
<rect x="845" y="222" width="270" height="46" rx="8" fill="#f0f6ef" stroke="#3f7a2e" stroke-width="2"/>
<text x="980" y="251" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1e1b15">Gazebo · simulación</text>
<rect x="845" y="276" width="270" height="46" rx="8" fill="#f0f6ef" stroke="#3f7a2e" stroke-width="2"/>
<text x="980" y="305" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1e1b15">rqt · diagnóstico</text>
<rect x="845" y="330" width="270" height="46" rx="8" fill="#faf5ea" stroke="#a97b23" stroke-width="2"/>
<text x="980" y="352" text-anchor="middle" font-family="monospace, monospace" font-size="14" fill="#1e1b15">ROS_DOMAIN_ID=42</text>
<text x="980" y="369" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#8b8577">mismo valor en todos los equipos</text>

<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a3a"/>
</marker>
</defs>
<line x1="385" y1="245" x2="435" y2="245" stroke="#2f6fb0" stroke-width="4" marker-end="url(#ar)"/>
<line x1="765" y1="245" x2="815" y2="245" stroke="#3f7a2e" stroke-width="4" marker-end="url(#ar)"/>
<text x="790" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#3f7a2e">Wi-Fi</text>

<line x1="600" y1="405" x2="600" y2="460" stroke="#a97b23" stroke-width="5" marker-end="url(#ar)"/>
<text x="700" y="438" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#a97b23">serie / UDP / CAN — XRCE-DDS</text>

<rect x="330" y="465" width="540" height="180" rx="14" fill="#ffffff" stroke="#a97b23" stroke-width="4"/>
<text x="600" y="500" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#1e1b15" font-weight="bold">Microcontrolador con micro-ROS</text>
<text x="600" y="522" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#8b8577">ESP32 · STM32 · Teensy 4.1 — aparece como un nodo más del grafo</text>
<rect x="360" y="536" width="230" height="42" rx="8" fill="#faf5ea" stroke="#a97b23" stroke-width="2"/>
<text x="475" y="562" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1e1b15">Bucle PID a 1 kHz</text>
<rect x="610" y="536" width="230" height="42" rx="8" fill="#faf5ea" stroke="#a97b23" stroke-width="2"/>
<text x="725" y="562" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1e1b15">Lectura de encoders</text>
<rect x="360" y="586" width="230" height="42" rx="8" fill="#faf5ea" stroke="#a97b23" stroke-width="2"/>
<text x="475" y="612" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1e1b15">Generación de PWM</text>
<rect x="610" y="586" width="230" height="42" rx="8" fill="#fdf1ef" stroke="#b2281e" stroke-width="2"/>
<text x="725" y="612" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#7a1c14">Paro si pierde el enlace</text>

<line x1="600" y1="645" x2="600" y2="690" stroke="#3a3a3a" stroke-width="4" marker-end="url(#ar)"/>
<rect x="330" y="692" width="255" height="66" rx="12" fill="#ffffff" stroke="#8b8577" stroke-width="3"/>
<text x="457" y="720" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#1e1b15" font-weight="bold">Driver de motores</text>
<text x="457" y="744" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#57534a">ODrive · VESC · puente H</text>

<rect x="615" y="692" width="255" height="66" rx="12" fill="#fdf1ef" stroke="#b2281e" stroke-width="3"/>
<text x="742" y="718" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#7a1c14" font-weight="bold">Parada de emergencia</text>
<text x="742" y="742" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#b2281e">circuito cableado, jamás por software</text>

<text x="600" y="795" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#8b8577">ukrabot.cl · Blog de Ingeniería Robótica</text>
