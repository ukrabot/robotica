<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Diagrama de un brazo planar de dos eslabones con las dos soluciones de cinemática inversa, codo arriba y codo abajo, alcanzando el mismo punto objetivo">
<rect width="1200" height="820" fill="#f6f4ee"/>
<text x="600" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="35" fill="#1e1b15">Brazo planar de dos eslabones: dos soluciones, un mismo punto</text>
<text x="600" y="88" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#57534a">La cinemática inversa no tiene respuesta única: hay que elegir configuración</text>

<rect x="55" y="120" width="700" height="560" rx="16" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>

<line x1="130" y1="560" x2="700" y2="560" stroke="#c9c4b8" stroke-width="2"/>
<line x1="130" y1="560" x2="130" y2="170" stroke="#c9c4b8" stroke-width="2"/>
<text x="710" y="566" font-family="Inter, Arial, sans-serif" font-size="18" fill="#8b8577">X</text>
<text x="118" y="163" font-family="Inter, Arial, sans-serif" font-size="18" fill="#8b8577">Y</text>

<line x1="130" y1="560" x2="390" y2="330" stroke="#a97b23" stroke-width="9" stroke-linecap="round"/>
<line x1="390" y1="330" x2="560" y2="410" stroke="#a97b23" stroke-width="9" stroke-linecap="round"/>
<circle cx="390" cy="330" r="14" fill="#ffffff" stroke="#a97b23" stroke-width="5"/>
<text x="248" y="418" font-family="Inter, Arial, sans-serif" font-size="19" fill="#a97b23" font-weight="bold">L₁</text>
<text x="470" y="352" font-family="Inter, Arial, sans-serif" font-size="19" fill="#a97b23" font-weight="bold">L₂</text>
<text x="322" y="306" font-family="Inter, Arial, sans-serif" font-size="17" fill="#a97b23">codo arriba</text>

<line x1="130" y1="560" x2="345" y2="530" stroke="#2f6fb0" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
<line x1="345" y1="530" x2="560" y2="410" stroke="#2f6fb0" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
<circle cx="345" cy="530" r="14" fill="#ffffff" stroke="#2f6fb0" stroke-width="5"/>
<text x="300" y="576" font-family="Inter, Arial, sans-serif" font-size="17" fill="#2f6fb0">codo abajo</text>

<circle cx="130" cy="560" r="18" fill="#23201b"/>
<rect x="100" y="578" width="60" height="16" rx="4" fill="#3a352c"/>
<text x="90" y="616" font-family="Inter, Arial, sans-serif" font-size="17" fill="#1e1b15" font-weight="bold">Base</text>

<circle cx="560" cy="410" r="13" fill="#b2281e"/>
<text x="580" y="404" font-family="Inter, Arial, sans-serif" font-size="19" fill="#b2281e" font-weight="bold">(x, y)</text>
<text x="580" y="430" font-family="Inter, Arial, sans-serif" font-size="15" fill="#57534a">objetivo</text>

<path d="M 175 560 A 45 45 0 0 0 161 528" fill="none" stroke="#3a3a3a" stroke-width="3"/>
<text x="182" y="530" font-family="Inter, Arial, sans-serif" font-size="17" fill="#1e1b15">q₁</text>
<path d="M 428 348 A 42 42 0 0 0 418 306" fill="none" stroke="#3a3a3a" stroke-width="3"/>
<text x="426" y="300" font-family="Inter, Arial, sans-serif" font-size="17" fill="#1e1b15">q₂</text>

<line x1="130" y1="560" x2="560" y2="410" stroke="#8b8577" stroke-width="2" stroke-dasharray="8 6"/>
<text x="330" y="480" font-family="Inter, Arial, sans-serif" font-size="16" fill="#8b8577">r = √(x² + y²)</text>

<path d="M 130 560 m -0 0 A 430 430 0 0 1 130 130" fill="none" stroke="#3f7a2e" stroke-width="2" stroke-dasharray="6 8"/>
<text x="500" y="180" font-family="Inter, Arial, sans-serif" font-size="16" fill="#3f7a2e">alcance máximo  r = L₁ + L₂</text>

<rect x="790" y="120" width="355" height="270" rx="14" fill="#ffffff" stroke="#a97b23" stroke-width="3"/>
<text x="967" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#1e1b15" font-weight="bold">Cinemática directa</text>
<text x="815" y="196" font-family="monospace, monospace" font-size="16" fill="#1e1b15">x = L₁·cos(q₁) + L₂·cos(q₁+q₂)</text>
<text x="815" y="226" font-family="monospace, monospace" font-size="16" fill="#1e1b15">y = L₁·sen(q₁) + L₂·sen(q₁+q₂)</text>
<rect x="815" y="248" width="305" height="52" rx="8" fill="#f0f6ef" stroke="#3f7a2e" stroke-width="2"/>
<text x="967" y="272" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#2f5c22" font-weight="bold">Solución única siempre</text>
<text x="967" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#3f7a2e">producto de matrices, sin ambigüedad</text>
<text x="815" y="330" font-family="Inter, Arial, sans-serif" font-size="15" fill="#57534a">Coste de cálculo bajo y constante.</text>
<text x="815" y="356" font-family="Inter, Arial, sans-serif" font-size="15" fill="#57534a">Se usa para verificar toda solución</text>
<text x="815" y="378" font-family="Inter, Arial, sans-serif" font-size="15" fill="#57534a">obtenida por cinemática inversa.</text>

<rect x="790" y="410" width="355" height="270" rx="14" fill="#ffffff" stroke="#2f6fb0" stroke-width="3"/>
<text x="967" y="448" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#1e1b15" font-weight="bold">Cinemática inversa</text>
<text x="815" y="484" font-family="monospace, monospace" font-size="14" fill="#1e1b15">cos q₂ = (r²−L₁²−L₂²)/(2·L₁·L₂)</text>
<text x="815" y="510" font-family="monospace, monospace" font-size="14" fill="#1e1b15">q₂ = ± acos(...)</text>
<text x="815" y="536" font-family="monospace, monospace" font-size="14" fill="#1e1b15">q₁ = atan2(y,x) − atan2(...)</text>
<rect x="815" y="556" width="305" height="56" rx="8" fill="#fdf1ef" stroke="#b2281e" stroke-width="2"/>
<text x="967" y="580" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#7a1c14" font-weight="bold">Existe solo si |L₁−L₂| ≤ r ≤ L₁+L₂</text>
<text x="967" y="601" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#b2281e">fuera de ese anillo, el punto es inalcanzable</text>
<text x="815" y="640" font-family="Inter, Arial, sans-serif" font-size="15" fill="#57534a">El signo de q₂ elige codo arriba o abajo.</text>
<text x="815" y="664" font-family="Inter, Arial, sans-serif" font-size="15" fill="#57534a">Usa siempre atan2, nunca atan(y/x).</text>

<text x="600" y="730" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#57534a">Con el brazo extendido (r = L₁ + L₂) las dos soluciones se funden en una: es la singularidad de contorno,</text>
<text x="600" y="758" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#57534a">donde el extremo pierde la capacidad de moverse en dirección radial.</text>
<text x="600" y="794" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#8b8577">ukrabot.cl · Blog de Ingeniería Robótica</text>
</svg>
