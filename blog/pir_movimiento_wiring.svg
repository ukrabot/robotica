<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Diagrama de conexión del sensor PIR HC-SR501 a un Arduino Uno">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6fb0"/>
      <stop offset="1" stop-color="#1f4e7f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="820" fill="#f6f4ee"/>
  <text x="600" y="60" text-anchor="middle" fill="#1e1b15" font-family="Georgia, serif" font-size="36">Conexión del Sensor PIR HC-SR501 a Arduino Uno</text>

  <!-- Sensor PIR -->
  <g transform="translate(150 130)">
    <rect x="0" y="0" width="300" height="300" rx="16" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <path d="M 40 120 Q 150 20 260 120 Z" fill="#e7e3da" stroke="#a9a497" stroke-width="3"/>
    <g stroke="#b8b3a7" stroke-width="2" fill="none">
      <path d="M 150 40 L 150 120"/>
      <path d="M 95 65 L 95 120"/>
      <path d="M 205 65 L 205 120"/>
    </g>
    <rect x="90" y="130" width="120" height="150" rx="10" fill="#23201b"/>
    <text x="150" y="240" text-anchor="middle" fill="#e4c07a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">PIR</text>
    <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">
      <rect x="30" y="300" width="70" height="40" rx="6" fill="#b04a3a"/><text x="65" y="327" text-anchor="middle" fill="#fff">VCC</text>
      <rect x="115" y="300" width="70" height="40" rx="6" fill="#a97b23"/><text x="150" y="327" text-anchor="middle" fill="#fff">OUT</text>
      <rect x="200" y="300" width="70" height="40" rx="6" fill="#3a3a3a"/><text x="235" y="327" text-anchor="middle" fill="#fff">GND</text>
    </g>
  </g>

  <!-- Placa Arduino -->
  <g transform="translate(620 130)">
    <rect x="0" y="0" width="440" height="300" rx="14" fill="url(#board)" stroke="#16354f" stroke-width="3"/>
    <g fill="#e8e2d4">
      <rect x="330" y="24" width="26" height="12" rx="2"/>
      <rect x="366" y="24" width="26" height="12" rx="2"/>
      <rect x="330" y="48" width="26" height="12" rx="2"/>
      <rect x="366" y="48" width="26" height="12" rx="2"/>
      <rect x="330" y="72" width="26" height="12" rx="2"/>
      <rect x="366" y="72" width="26" height="12" rx="2"/>
    </g>
    <g font-family="Inter, Arial, sans-serif" font-size="20" fill="#ffffff">
      <text x="150" y="40">5V</text>
      <text x="150" y="90">GND</text>
      <text x="150" y="140">D2 (entrada)</text>
      <text x="150" y="190">D13 (LED)</text>
    </g>
    <rect x="30" y="250" width="40" height="30" rx="6" fill="#e8d9b6"/>
    <rect x="30" y="210" width="40" height="30" rx="6" fill="#cfc7b6"/>
    <text x="220" y="170" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">Arduino Uno</text>
  </g>

  <!-- Cables -->
  <g stroke-linecap="round" fill="none">
    <path d="M 215 330 C 300 330 300 160 620 160" stroke="#b04a3a" stroke-width="7"/>
    <path d="M 265 330 C 340 330 340 210 620 210" stroke="#a97b23" stroke-width="7"/>
    <path d="M 285 330 C 380 330 380 260 620 260" stroke="#3a3a3a" stroke-width="7"/>
  </g>

  <!-- Etiquetas de cables -->
  <g font-family="Inter, Arial, sans-serif" font-size="20" fill="#57534a">
    <text x="340" y="150">VCC → 5V</text>
    <text x="340" y="205">OUT → D2</text>
    <text x="340" y="258">GND → GND</text>
  </g>

  <!-- Circuito de salida (LED + buzzer) -->
  <g transform="translate(150 560)">
    <rect x="0" y="0" width="910" height="180" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <text x="455" y="40" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Salida de alarma opcional</text>
    <g font-family="Inter, Arial, sans-serif" font-size="19" fill="#57534a">
      <circle cx="110" cy="110" r="16" fill="#2f6fb0"/><text x="140" y="117">LED azul (D13) + resistencia 220 Ω</text>
      <circle cx="500" cy="110" r="16" fill="#a97b23"/><text x="530" y="117">Buzzer activo a GND</text>
    </g>
  </g>

  <text x="600" y="790" text-anchor="middle" fill="#8b8577" font-family="Inter, Arial, sans-serif" font-size="18">El potenciómetro del PIR ajusta sensibilidad y tiempo de re-disparo; el jumper H/L selecciona el modo de repetición.</text>
</svg>
