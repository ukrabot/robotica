<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Flujograma del algoritmo iterativo de cinemática inversa con Damped Least Squares">
<rect width="1200" height="750" fill="#f6f4ee"/>
<text x="600" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#1e1b15" font-weight="bold">Algoritmo del Solver Numérico de Cinemática Inversa (DLS / LM)</text>
<text x="600" y="78" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#57534a">Mínimos Cuadrados Amortiguados, proyección en el espacio nulo y límites articulares</text>

<g transform="translate(150, 110)">
  <rect x="0" y="0" width="900" height="600" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="2"/>
  
  <!-- Step 1: Input -->
  <g transform="translate(250, 25)">
    <rect x="0" y="0" width="400" height="55" rx="8" fill="#faf7f0" stroke="#a97b23" stroke-width="1.5"/>
    <text x="200" y="25" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#1e1b15" font-weight="bold">Pose Objetivo: T_target (Posición p* + Rotación R*)</text>
    <text x="200" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#57534a">Configuración inicial: q_0 (vector de ángulos articulares)</text>
  </g>
  <line x1="450" y1="80" x2="450" y2="105" stroke="#1e1b15" stroke-width="2"/>
  <polygon points="446,105 450,113 454,105" fill="#1e1b15"/>
  
  <!-- Step 2: Forward Kinematics & Error Vector -->
  <g transform="translate(200, 115)">
    <rect x="0" y="0" width="500" height="75" rx="8" fill="#eef6fc" stroke="#2f6fb0" stroke-width="1.5"/>
    <text x="250" y="25" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#2f6fb0" font-weight="bold">1. Cinemática Directa y Vector de Error e(q)</text>
    <text x="250" y="46" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#1e1b15">e = [ e_pos ; e_rot ] = [ p_target - p(q) ; ½ · (n×n* + s×s* + a×a*) ]</text>
    <text x="250" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#57534a">Dimensión de e: 6×1 (3 traslación + 3 rotación)</text>
  </g>
  <line x1="450" y1="190" x2="450" y2="215" stroke="#1e1b15" stroke-width="2"/>
  <polygon points="446,215 450,223 454,215" fill="#1e1b15"/>
  
  <!-- Step 3: Convergence Check (Decision Diamond) -->
  <g transform="translate(275, 225)">
    <polygon points="175,0 350,35 175,70 0,35" fill="#faf7f0" stroke="#e4c07a" stroke-width="2"/>
    <text x="175" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15" font-weight="bold">¿ ||e|| &lt; Tolerancia?</text>
    <text x="175" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#57534a">(ej: &lt; 0.1 mm y &lt; 0.001 rad)</text>
  </g>
  
  <!-- YES branch -> Output Solution -->
  <line x1="625" y1="260" x2="720" y2="260" stroke="#2b8a3e" stroke-width="3"/>
  <polygon points="720,256 728,260 720,264" fill="#2b8a3e"/>
  <text x="665" y="250" font-family="Inter, sans-serif" font-size="12" fill="#2b8a3e" font-weight="bold">SÍ (Convergencia)</text>
  
  <g transform="translate(730, 230)">
    <rect x="0" y="0" width="140" height="60" rx="8" fill="#eefaf0" stroke="#2b8a3e" stroke-width="2"/>
    <text x="70" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#2b8a3e" font-weight="bold">Retornar q*</text>
    <text x="70" y="46" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#57534a">Solución Válida</text>
  </g>
  
  <!-- NO branch -> Compute Jacobian & DLS -->
  <line x1="450" y1="295" x2="450" y2="325" stroke="#1e1b15" stroke-width="2"/>
  <polygon points="446,325 450,333 454,325" fill="#1e1b15"/>
  <text x="460" y="315" font-family="Inter, sans-serif" font-size="11" fill="#c92a2a" font-weight="bold">NO</text>
  
  <g transform="translate(180, 335)">
    <rect x="0" y="0" width="540" height="85" rx="8" fill="#ffffff" stroke="#c9c4b8" stroke-width="1.5"/>
    <text x="270" y="25" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#1e1b15" font-weight="bold">2. Cálculo de la Matriz Jacobiana J(q) (6×N)</text>
    <text x="270" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2f6fb0">J_i = [ z_{i-1} × (p_tcp - p_{i-1}) ; z_{i-1} ]</text>
    <text x="270" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#57534a">Columnas correspondientes a cada eje de rotación</text>
  </g>
  <line x1="450" y1="420" x2="450" y2="445" stroke="#1e1b15" stroke-width="2"/>
  <polygon points="446,445 450,453 454,445" fill="#1e1b15"/>
  
  <!-- Step 4: DLS Inversion & Update -->
  <g transform="translate(150, 455)">
    <rect x="0" y="0" width="600" height="90" rx="8" fill="#faf7f0" stroke="#a97b23" stroke-width="1.5"/>
    <text x="300" y="25" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#a97b23" font-weight="bold">3. Inversión Robusta: Damped Least Squares (DLS)</text>
    <text x="300" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#1e1b15">Δq = Jᵀ · (J · Jᵀ + λ² · I)⁻¹ · e + (I - J⁺ J) · ∇H(q)</text>
    <text x="300" y="74" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#2f6fb0">Amortiguamiento λ evita singularidades · Espacio Nulo optimiza límites articulares</text>
  </g>
  
  <!-- Step 5: Loop Back -->
  <path d="M 150,500 L 80,500 L 80,152 L 200,152" fill="none" stroke="#1e1b15" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="195,148 205,152 195,156" fill="#1e1b15"/>
  <text x="50" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#57534a" transform="rotate(-90 50 340)">q_{k+1} = q_k + clamp(Δq, -Δq_max, Δq_max)</text>
</g>
</svg>