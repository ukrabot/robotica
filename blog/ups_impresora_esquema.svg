<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Dos estrategias de conexión de un UPS a una impresora 3D: alimentar la máquina completa o alimentar solo la electrónica dejando la cama caliente en la red">
  <defs>
    <marker id="ar" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="1200" height="820" fill="#f6f4ee"/>

  <text x="600" y="55" text-anchor="middle" fill="#1e1b15" font-family="Georgia, serif" font-size="35">Dos estrategias de proteccion</text>
  <text x="600" y="88" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="19">La cama caliente se lleva el 80 % del consumo: decide si merece la pena respaldarla</text>

  <!-- ESTRATEGIA A -->
  <g>
    <rect x="55" y="125" width="530" height="480" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <rect x="55" y="125" width="530" height="48" rx="14" fill="#2f6fb0"/>
    <rect x="55" y="159" width="530" height="14" fill="#2f6fb0"/>
    <text x="320" y="158" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">A. UPS a la impresora completa</text>

    <!-- red -->
    <rect x="90" y="210" width="120" height="66" rx="10" fill="#f6f4ee" stroke="#8b8577" stroke-width="3"/>
    <text x="150" y="240" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">Red 230 V</text>
    <text x="150" y="262" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="15">50 Hz</text>

    <!-- ups -->
    <rect x="250" y="200" width="140" height="86" rx="10" fill="#23201b" stroke="#0f0d0a" stroke-width="3"/>
    <text x="320" y="234" text-anchor="middle" fill="#e4c07a" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600">UPS</text>
    <text x="320" y="262" text-anchor="middle" fill="#c9c4b8" font-family="Inter, Arial, sans-serif" font-size="16">1500 VA</text>

    <!-- impresora -->
    <rect x="430" y="196" width="130" height="94" rx="10" fill="#fdf1ef" stroke="#b2281e" stroke-width="3"/>
    <text x="495" y="228" text-anchor="middle" fill="#7a1c14" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">Impresora</text>
    <text x="495" y="252" text-anchor="middle" fill="#b2281e" font-family="Inter, Arial, sans-serif" font-size="15">completa</text>
    <text x="495" y="274" text-anchor="middle" fill="#b2281e" font-family="Inter, Arial, sans-serif" font-size="15">350 a 500 W</text>

    <g stroke="#3a3a3a" stroke-width="4" fill="none" marker-end="url(#ar)">
      <path d="M 210 243 L 244 243"/>
      <path d="M 390 243 L 424 243"/>
    </g>

    <g font-family="Inter, Arial, sans-serif" font-size="17">
      <text x="90" y="336" fill="#1e1b15" font-weight="600">Consumo respaldado: 350 a 500 W</text>
      <text x="90" y="366" fill="#57534a">Autonomia con 1500 VA / 900 W utiles: 8 a 12 min</text>
      <text x="90" y="396" fill="#57534a">Coste orientativo del equipo: 250 a 450 USD</text>
      <text x="90" y="426" fill="#2f5c22" font-weight="600">A favor</text>
      <text x="90" y="454" fill="#57534a">Protege absolutamente todo, cama incluida</text>
      <text x="90" y="480" fill="#57534a">Sin modificaciones en la maquina</text>
      <text x="90" y="510" fill="#7a1c14" font-weight="600">En contra</text>
      <text x="90" y="538" fill="#57534a">Autonomia corta pese al equipo grande</text>
      <text x="90" y="564" fill="#57534a">Baterias caras de reponer cada 3 a 5 anos</text>
      <text x="90" y="590" fill="#57534a">Ocupa espacio y pesa 15 a 25 kg</text>
    </g>
  </g>

  <!-- ESTRATEGIA B -->
  <g>
    <rect x="615" y="125" width="530" height="480" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <rect x="615" y="125" width="530" height="48" rx="14" fill="#3f7a2e"/>
    <rect x="615" y="159" width="530" height="14" fill="#3f7a2e"/>
    <text x="880" y="158" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">B. UPS solo a la electronica</text>

    <rect x="648" y="210" width="112" height="66" rx="10" fill="#f6f4ee" stroke="#8b8577" stroke-width="3"/>
    <text x="704" y="240" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">Red 230 V</text>
    <text x="704" y="262" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="15">50 Hz</text>

    <rect x="795" y="180" width="120" height="76" rx="10" fill="#23201b" stroke="#0f0d0a" stroke-width="3"/>
    <text x="855" y="210" text-anchor="middle" fill="#e4c07a" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600">UPS</text>
    <text x="855" y="236" text-anchor="middle" fill="#c9c4b8" font-family="Inter, Arial, sans-serif" font-size="16">650 VA</text>

    <rect x="960" y="170" width="150" height="76" rx="10" fill="#f0f6ef" stroke="#3f7a2e" stroke-width="3"/>
    <text x="1035" y="198" text-anchor="middle" fill="#2f5c22" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">Placa + motores</text>
    <text x="1035" y="220" text-anchor="middle" fill="#3f7a2e" font-family="Inter, Arial, sans-serif" font-size="15">+ hotend + host</text>
    <text x="1035" y="240" text-anchor="middle" fill="#3f7a2e" font-family="Inter, Arial, sans-serif" font-size="15">60 a 110 W</text>

    <rect x="960" y="278" width="150" height="62" rx="10" fill="#fdf1ef" stroke="#b2281e" stroke-width="3"/>
    <text x="1035" y="306" text-anchor="middle" fill="#7a1c14" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">Cama caliente</text>
    <text x="1035" y="328" text-anchor="middle" fill="#b2281e" font-family="Inter, Arial, sans-serif" font-size="15">sin respaldo, 300 W</text>

    <g stroke="#3a3a3a" stroke-width="4" fill="none" marker-end="url(#ar)">
      <path d="M 760 232 L 789 224"/>
      <path d="M 915 210 L 954 208"/>
      <path d="M 704 276 L 704 309 L 954 309"/>
    </g>

    <g font-family="Inter, Arial, sans-serif" font-size="17">
      <text x="648" y="380" fill="#1e1b15" font-weight="600">Consumo respaldado: 60 a 110 W</text>
      <text x="648" y="410" fill="#57534a">Autonomia con 650 VA / 390 W utiles: 25 a 45 min</text>
      <text x="648" y="440" fill="#57534a">Coste orientativo del equipo: 90 a 160 USD</text>
      <text x="648" y="470" fill="#2f5c22" font-weight="600">A favor</text>
      <text x="648" y="498" fill="#57534a">Cuatro veces mas autonomia por menos dinero</text>
      <text x="648" y="524" fill="#57534a">Permite guardar posicion y hacer parada ordenada</text>
      <text x="648" y="550" fill="#7a1c14" font-weight="600">En contra</text>
      <text x="648" y="578" fill="#57534a">La cama se enfria: riesgo de despegue de la pieza</text>
      <text x="648" y="598" fill="#57534a">Requiere separar circuitos dentro de la maquina</text>
    </g>
  </g>

  <!-- Franja inferior -->
  <rect x="55" y="630" width="1090" height="140" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
  <text x="600" y="668" text-anchor="middle" fill="#1e1b15" font-family="Georgia, serif" font-size="24">Regla practica de dimensionado</text>
  <rect x="330" y="686" width="540" height="40" rx="8" fill="#23201b"/>
  <text x="600" y="713" text-anchor="middle" fill="#e4c07a" font-family="Inter, Arial, sans-serif" font-size="20">Autonomia (min) = Wh utiles x 60 / Potencia real (W)</text>
  <text x="600" y="752" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="17">Los Wh utiles rondan el 50 % de la capacidad nominal de la bateria: no descargues plomo por debajo de la mitad si quieres que dure.</text>
</svg>
