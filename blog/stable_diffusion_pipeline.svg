<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Diagrama del pipeline de Stable Diffusion: texto, CLIP, UNet, VAE y dónde se usa la VRAM">
  <rect width="1200" height="820" fill="#f6f4ee"/>
  <text x="600" y="60" text-anchor="middle" fill="#1e1b15" font-family="Georgia, serif" font-size="36">Pipeline de Stable Diffusion: dónde se gasta la VRAM</text>

  <!-- Texto -->
  <g transform="translate(50 150)">
    <rect x="0" y="0" width="190" height="150" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <text x="95" y="55" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Prompt</text>
    <text x="95" y="95" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="17">"un gato robótico</text>
    <text x="95" y="120" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="17">al estilo cyberpunk"</text>
  </g>

  <!-- CLIP -->
  <g transform="translate(300 150)">
    <rect x="0" y="0" width="190" height="150" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <text x="95" y="55" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">CLIP</text>
    <text x="95" y="95" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="17">Texto → embeddings</text>
    <text x="95" y="120" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="17">(77 tokens)</text>
  </g>

  <!-- UNet -->
  <g transform="translate(550 150)">
    <rect x="0" y="0" width="260" height="150" rx="14" fill="#ffffff" stroke="#2f6fb0" stroke-width="4"/>
    <rect x="0" y="0" width="260" height="52" rx="14" fill="#2f6fb0"/>
    <text x="130" y="34" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">UNet (denoising)</text>
    <text x="130" y="95" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="17">20–50 pasos de difusión</text>
    <text x="130" y="125" text-anchor="middle" fill="#2f6fb0" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600">Aquí vive la mayor parte de la VRAM</text>
  </g>

  <!-- VAE -->
  <g transform="translate(870 150)">
    <rect x="0" y="0" width="190" height="150" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <text x="95" y="55" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">VAE</text>
    <text x="95" y="95" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="17">latente → imagen</text>
    <text x="95" y="120" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="17">512×512 px</text>
  </g>

  <!-- Imagen -->
  <g transform="translate(1090 150)">
    <rect x="0" y="0" width="80" height="150" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <text x="40" y="60" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600">Imagen</text>
    <text x="40" y="95" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="15">PNG</text>
  </g>

  <!-- Flechas -->
  <g stroke="#3a3a3a" stroke-width="5" fill="none" marker-end="url(#a2)">
    <defs><marker id="a2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3a3a3a"/></marker></defs>
    <path d="M 240 225 L 300 225"/>
    <path d="M 490 225 L 550 225"/>
    <path d="M 810 225 L 870 225"/>
    <path d="M 1060 225 L 1090 225"/>
  </g>

  <!-- Tabla de memoria -->
  <g transform="translate(50 380)">
    <rect x="0" y="0" width="1120" height="340" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <text x="560" y="42" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">VRAM necesaria según modelo y resolución</text>
    <g font-family="Inter, Arial, sans-serif" font-size="19">
      <line x1="0" y1="70" x2="1120" y2="70" stroke="#c9c4b8" stroke-width="2"/>
      <text x="30" y="110" fill="#1e1b15" font-weight="600">Modelo</text>
      <text x="330" y="110" fill="#1e1b15" font-weight="600">Resolución</text>
      <text x="560" y="110" fill="#1e1b15" font-weight="600">VRAM mínima</text>
      <text x="800" y="110" fill="#1e1b15" font-weight="600">VRAM cómoda</text>
      <line x1="0" y1="130" x2="1120" y2="130" stroke="#c9c4b8" stroke-width="2"/>
      <text x="30" y="170" fill="#57534a">SD 1.5 (512×512)</text>
      <text x="330" y="170" fill="#57534a">512×512</text>
      <text x="560" y="170" fill="#2f6fb0" font-weight="600">4 GB</text>
      <text x="800" y="170" fill="#57534a">6 GB</text>
      <text x="30" y="215" fill="#57534a">SDXL (1024×1024)</text>
      <text x="330" y="215" fill="#57534a">1024×1024</text>
      <text x="560" y="215" fill="#2f6fb0" font-weight="600">8 GB</text>
      <text x="800" y="215" fill="#57534a">12–16 GB</text>
      <text x="30" y="260" fill="#57534a">Fine-tuning LoRA</text>
      <text x="330" y="260" fill="#57534a">512×512</text>
      <text x="560" y="260" fill="#2f6fb0" font-weight="600">8 GB</text>
      <text x="800" y="260" fill="#57534a">12 GB</text>
      <text x="30" y="305" fill="#57534a">Video (SVD)</text>
      <text x="330" y="305" fill="#57534a">576×1024</text>
      <text x="560" y="305" fill="#2f6fb0" font-weight="600">16 GB</text>
      <text x="800" y="305" fill="#57534a">24 GB</text>
    </g>
  </g>

  <text x="600" y="795" text-anchor="middle" fill="#8b8577" font-family="Inter, Arial, sans-serif" font-size="18">Con 4 GB se genera en SD 1.5 usando fp16, xformers y el modo --medvram; con menos de 4 GB, la experiencia es limitada.</text>
</svg>
