<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Topología de una red domótica local con Home Assistant Green, Zigbee, Wi-Fi y acceso móvil seguro">
  <rect width="1200" height="820" fill="#f6f4ee"/>
  <text x="600" y="60" text-anchor="middle" fill="#1e1b15" font-family="Georgia, serif" font-size="36">Domótica Local con Home Assistant Green</text>

  <!-- HUB -->
  <g transform="translate(420 120)">
    <rect x="0" y="0" width="360" height="220" rx="18" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <rect x="110" y="20" width="140" height="90" rx="12" fill="#1e7a52"/>
    <text x="180" y="72" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Home</text>
    <text x="180" y="98" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Assistant</text>
    <text x="180" y="145" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">Green</text>
    <text x="180" y="180" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="18">Radio Zigbee 802.15.4 integrada</text>
    <text x="180" y="208" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="18">Ethernet + USB-C Power</text>
  </g>

  <!-- Zigbee -->
  <g transform="translate(60 420)">
    <rect x="0" y="0" width="300" height="150" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <text x="150" y="38" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Dispositivos Zigbee</text>
    <g font-family="Inter, Arial, sans-serif" font-size="18" fill="#57534a">
      <text x="25" y="80">• Sensor de puerta/ventana</text>
      <text x="25" y="112">• Enchufe inteligente</text>
      <text x="25" y="144">• Termostato y bombillas</text>
    </g>
  </g>

  <!-- WiFi -->
  <g transform="translate(430 420)">
    <rect x="0" y="0" width="300" height="150" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <text x="150" y="38" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Dispositivos Wi-Fi</text>
    <g font-family="Inter, Arial, sans-serif" font-size="18" fill="#57534a">
      <text x="25" y="80">• ESP32 / ESPHome</text>
      <text x="25" y="112">• Cámaras locales</text>
      <text x="25" y="144">• Altavoces y TV</text>
    </g>
  </g>

  <!-- Router -->
  <g transform="translate(800 420)">
    <rect x="0" y="0" width="300" height="150" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <text x="150" y="38" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Router / Switch</text>
    <text x="150" y="80" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="18">Red local (LAN)</text>
    <text x="150" y="112" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="18">Internet solo para actualizaciones</text>
  </g>

  <!-- Telefono -->
  <g transform="translate(800 620)">
    <rect x="0" y="0" width="300" height="120" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <text x="150" y="42" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Teléfono (app)</text>
    <text x="150" y="78" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="18">Mismo Wi-Fi o acceso cifrado</text>
    <text x="150" y="106" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="18">(Nabu Casa / VPN / Tailscale)</text>
  </g>

  <!-- Conexiones -->
  <g stroke="#3a3a3a" stroke-width="5" fill="none">
    <path d="M 420 320 C 300 350 240 380 210 420"/>
    <path d="M 600 340 C 600 380 580 400 580 420"/>
    <path d="M 780 320 C 860 350 900 380 920 420"/>
    <path d="M 950 570 C 950 590 950 600 950 620"/>
    <path d="M 600 340 C 600 560 560 620 540 640"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="19" fill="#57534a">
    <text x="180" y="400">Zigbee (malla)</text>
    <text x="430" y="400">Wi-Fi local</text>
    <text x="700" y="400">Ethernet</text>
    <text x="950" y="580">HTTPS seguro</text>
    <text x="400" y="620">todo queda en casa</text>
  </g>

  <text x="600" y="790" text-anchor="middle" fill="#8b8577" font-family="Inter, Arial, sans-serif" font-size="18">La clave del diseño local-first: si se corta internet, la iluminación, la calefacción y las alarmas siguen funcionando.</text>
</svg>
