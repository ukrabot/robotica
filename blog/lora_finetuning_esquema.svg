<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Descomposición de bajo rango LoRA y pipeline de entrenamiento local">
<rect width="1200" height="750" fill="#f6f4ee"/>
<text x="600" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#1e1b15" font-weight="bold">Fine-Tuning de Modelos de Difusión con LoRA en Hardware Local</text>
<text x="600" y="78" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#57534a">Descomposición matricial W = W₀ + B·A, optimizadores 8-bit y gestión de VRAM en GPUs domésticas</text>

<g transform="translate(60, 110)">
  <rect x="0" y="0" width="1080" height="600" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="2"/>
  
  <!-- Left Side: Mathematical Decomposition -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="480" height="540" rx="10" fill="#faf7f0" stroke="#e4c07a" stroke-width="1.5"/>
    <text x="240" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#a97b23" font-weight="bold">Matemática de Low-Rank Adaptation (LoRA)</text>
    
    <!-- Base Weight Matrix W0 (Frozen) -->
    <g transform="translate(30, 65)">
      <rect x="0" y="0" width="160" height="160" rx="6" fill="#dee2e6" stroke="#495057" stroke-width="2"/>
      <text x="80" y="75" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#1e1b15" font-weight="bold">W₀ (Congelada)</text>
      <text x="80" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#57534a">d × k (ej: 4096×4096)</text>
      <text x="80" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#2b8a3e">16.7M parámetros</text>
      <text x="80" y="145" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#c92a2a">Gradientes = 0</text>
    </g>
    
    <text x="215" y="160" font-family="Georgia, serif" font-size="32" fill="#1e1b15" font-weight="bold">+</text>
    
    <!-- Low Rank Matrices B and A -->
    <g transform="translate(240, 65)">
      <!-- Matrix B -->
      <rect x="0" y="0" width="50" height="160" rx="4" fill="#eef6fc" stroke="#2f6fb0" stroke-width="1.5"/>
      <text x="25" y="85" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#2f6fb0" font-weight="bold">B</text>
      <text x="25" y="105" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#57534a">d × r</text>
      
      <text x="65" y="90" font-family="Georgia, serif" font-size="20" fill="#1e1b15">×</text>
      
      <!-- Matrix A -->
      <rect x="80" y="55" width="140" height="50" rx="4" fill="#eef6fc" stroke="#2f6fb0" stroke-width="1.5"/>
      <text x="150" y="85" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#2f6fb0" font-weight="bold">A (r × k)</text>
      
      <text x="110" y="140" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#2f6fb0" font-weight="bold">Rango r = 16 ó 32</text>
      <text x="110" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#57534a">Parámetros: 131k (0.78%)</text>
    </g>
    
    <!-- Formula -->
    <rect x="25" y="245" width="430" height="70" rx="6" fill="#ffffff" stroke="#adb5bd"/>
    <text x="215" y="275" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1e1b15">h = W₀ · x + (α / r) · B · A · x</text>
    <text x="215" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#57534a">Escalado α (Alpha) controla el peso de la adaptación en la inferencia</text>
    
    <!-- Memory Table -->
    <g transform="translate(25, 330)">
      <rect x="0" y="0" width="430" height="180" rx="8" fill="#eefaf0" stroke="#2b8a3e" stroke-width="1"/>
      <text x="15" y="25" font-family="Inter, sans-serif" font-size="13" fill="#2b8a3e" font-weight="bold">Ahorro de VRAM y Almacenamiento:</text>
      
      <text x="15" y="55" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15">• Checkpoint Full (SDXL): <strong>6.6 GB</strong> (Requiere &gt; 24GB VRAM)</text>
      <text x="15" y="80" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15">• Archivo LoRA (Safetensors): <strong>50 - 220 MB</strong> (Modular e intercambiable)</text>
      <text x="15" y="105" font-family="Inter, sans-serif" font-size="12" fill="#1e1b15">• Entrenamiento con AdamW 8-bit + xFormers: <strong>8 - 12 GB VRAM</strong></text>
      <text x="15" y="130" font-family="Inter, sans-serif" font-size="12" fill="#2b8a3e">• Tiempo de entrenamiento en RTX 3060 / 4060: <strong>20 - 45 minutos</strong></text>
    </g>
  </g>
  
  <!-- Right Side: Training Pipeline (Kohya / sd-scripts) -->
  <g transform="translate(560, 30)">
    <rect x="0" y="0" width="480" height="540" rx="10" fill="#faf7f0" stroke="#2f6fb0" stroke-width="1.5"/>
    <text x="240" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#2f6fb0" font-weight="bold">Pipeline de Entrenamiento Local (Kohya_ss)</text>
    
    <!-- Step 1 -->
    <rect x="25" y="55" width="430" height="90" rx="6" fill="#ffffff" stroke="#8b8577"/>
    <text x="15" y="25" font-family="Inter, sans-serif" font-size="13" fill="#1e1b15" font-weight="bold" transform="translate(25, 55)">1. Dataset &amp; Tagging (15 - 40 Imágenes)</text>
    <text x="40" y="105" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Recorte y escalado con Aspect Ratio Bucketing</text>
    <text x="40" y="125" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Palabras de activación (Trigger Words) + WD14 Tagger</text>
    
    <!-- Step 2 -->
    <rect x="25" y="160" width="430" height="110" rx="6" fill="#ffffff" stroke="#8b8577"/>
    <text x="15" y="25" font-family="Inter, sans-serif" font-size="13" fill="#1e1b15" font-weight="bold" transform="translate(25, 160)">2. Hiperparámetros Recomendados</text>
    <text x="40" y="210" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Learning Rate UNet: <strong>1e-4</strong> (Cosine with Restarts)</text>
    <text x="40" y="230" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Learning Rate Text Encoder: <strong>5e-5</strong></text>
    <text x="40" y="250" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Network Rank / Dim: <strong>r = 16</strong> · Alpha: <strong>α = 16</strong></text>
    
    <!-- Step 3 -->
    <rect x="25" y="285" width="430" height="100" rx="6" fill="#ffffff" stroke="#8b8577"/>
    <text x="15" y="25" font-family="Inter, sans-serif" font-size="13" fill="#1e1b15" font-weight="bold" transform="translate(25, 285)">3. Optimizaciones de Hardware</text>
    <text x="40" y="335" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Gradient Checkpointing activado</text>
    <text x="40" y="355" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Optimizador: bitsandbytes Lion / AdamW 8-bit</text>
    <text x="40" y="375" font-family="Inter, sans-serif" font-size="11" fill="#2b8a3e">✓ Reduce el consumo de VRAM de 18GB a 7.2GB</text>
    
    <!-- Step 4 -->
    <rect x="25" y="400" width="430" height="110" rx="6" fill="#eef6fc" stroke="#2f6fb0" stroke-width="1.5"/>
    <text x="15" y="25" font-family="Inter, sans-serif" font-size="13" fill="#2f6fb0" font-weight="bold" transform="translate(25, 400)">4. Inferencia en ComfyUI / Automatic1111</text>
    <text x="40" y="450" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Inyección del nodo LoraLoader con fuerza 0.7 - 0.9</text>
    <text x="40" y="470" font-family="Inter, sans-serif" font-size="11" fill="#57534a">• Fusión permanente opcional con merge_lora.py</text>
    <text x="40" y="490" font-family="Inter, sans-serif" font-size="11" fill="#2b8a3e">✓ Cero latencia adicional en tiempo de generación</text>
  </g>
</g>
</svg>