<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Esquema de virtualización de estaciones de programación de PLC antiguos: host moderno con hipervisor, máquina virtual con sistema operativo heredado y software del fabricante, y paso de puertos serie y USB hacia el PLC">
<rect width="1200" height="820" fill="#f6f4ee"/>
<text x="600" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="35" fill="#1e1b15">Virtualización de estaciones de programación de PLC</text>
<text x="600" y="88" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#57534a">Un PC moderno reemplaza al portátil heredado sin perder el acceso al autómata</text>

<rect x="60" y="120" width="640" height="560" rx="16" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
<text x="380" y="158" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#1e1b15" font-weight="bold">PC anfitrión moderno</text>
<text x="380" y="184" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#8b8577">Windows 11 o Linux · SSD · 16 GB RAM · red aislada</text>

<rect x="90" y="205" width="580" height="72" rx="12" fill="#f0f6ef" stroke="#3f7a2e" stroke-width="3"/>
<text x="380" y="238" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#2f5c22" font-weight="bold">Hipervisor tipo 2</text>
<text x="380" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#3f7a2e">VirtualBox · VMware Workstation · Hyper-V</text>

<rect x="90" y="300" width="580" height="290" rx="12" fill="#23201b" stroke="#a97b23" stroke-width="3"/>
<text x="380" y="336" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#e4c07a" font-weight="bold">Máquina virtual heredada</text>
<line x1="120" y1="352" x2="640" y2="352" stroke="#57534a" stroke-width="2"/>
<text x="120" y="382" font-family="Inter, Arial, sans-serif" font-size="16" fill="#f6f4ee">Sistema operativo: Windows XP / 98 / MS-DOS</text>
<text x="120" y="412" font-family="Inter, Arial, sans-serif" font-size="16" fill="#f6f4ee">Software: Step 7 · RSLogix 500 · GX Developer</text>
<text x="120" y="442" font-family="Inter, Arial, sans-serif" font-size="16" fill="#f6f4ee">Licencia y llave de protección instaladas</text>
<text x="120" y="472" font-family="Inter, Arial, sans-serif" font-size="16" fill="#f6f4ee">Proyectos y copias de seguridad del programa</text>
<rect x="120" y="495" width="520" height="70" rx="10" fill="#3a352c" stroke="#8b8577" stroke-width="2"/>
<text x="380" y="522" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#e4c07a" font-weight="bold">Instantánea (snapshot) tras la instalación</text>
<text x="380" y="547" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#c9c4b8">Restaurar en segundos ante cualquier fallo</text>

<rect x="90" y="612" width="280" height="48" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="3"/>
<text x="230" y="642" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#2f6fb0" font-weight="bold">Puerto USB físico</text>
<rect x="390" y="612" width="280" height="48" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="3"/>
<text x="530" y="642" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#2f6fb0" font-weight="bold">Tarjeta PCIe serie RS-232</text>

<line x1="380" y1="277" x2="380" y2="300" stroke="#3a3a3a" stroke-width="4" marker-end="url(#ar)"/>
<line x1="230" y1="590" x2="230" y2="612" stroke="#3a3a3a" stroke-width="4" marker-end="url(#ar)"/>
<line x1="530" y1="590" x2="530" y2="612" stroke="#3a3a3a" stroke-width="4" marker-end="url(#ar)"/>

<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a3a"/>
</marker>
</defs>

<rect x="760" y="205" width="380" height="180" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
<text x="950" y="243" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#1e1b15" font-weight="bold">Cable de programación</text>
<text x="790" y="278" font-family="Inter, Arial, sans-serif" font-size="15" fill="#57534a">Serie nativo RS-232 (preferible)</text>
<text x="790" y="306" font-family="Inter, Arial, sans-serif" font-size="15" fill="#57534a">Adaptador USB-serie con chip FTDI</text>
<text x="790" y="334" font-family="Inter, Arial, sans-serif" font-size="15" fill="#57534a">PC Adapter MPI · PC/PPI · SC-09</text>
<text x="790" y="362" font-family="Inter, Arial, sans-serif" font-size="15" fill="#b2281e">Evitar clones con chip CH340 falsificado</text>

<rect x="760" y="430" width="380" height="250" rx="14" fill="#ffffff" stroke="#a97b23" stroke-width="3"/>
<text x="950" y="470" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#1e1b15" font-weight="bold">PLC en planta</text>
<rect x="800" y="495" width="300" height="60" rx="8" fill="#f6f4ee" stroke="#8b8577" stroke-width="2"/>
<text x="950" y="522" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#1e1b15">CPU · Fuente · Módulos E/S</text>
<text x="950" y="544" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#8b8577">S7-300 · SLC 500 · FX2N · CQM1</text>
<rect x="800" y="575" width="300" height="78" rx="8" fill="#fdf1ef" stroke="#b2281e" stroke-width="2"/>
<text x="950" y="602" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#7a1c14" font-weight="bold">Red industrial aislada</text>
<text x="950" y="626" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#b2281e">Sin salida a Internet ni a la red corporativa</text>
<text x="950" y="646" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#b2281e">Los sistemas heredados no reciben parches</text>

<line x1="700" y1="295" x2="760" y2="295" stroke="#3a3a3a" stroke-width="4" marker-end="url(#ar)"/>
<line x1="950" y1="385" x2="950" y2="430" stroke="#3a3a3a" stroke-width="4" marker-end="url(#ar)"/>
<line x1="670" y1="636" x2="760" y2="636" stroke="#2f6fb0" stroke-width="4" marker-end="url(#ar)"/>
<text x="715" y="626" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#2f6fb0">paso al invitado</text>

<text x="600" y="720" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#57534a">Regla de oro: el temporizado crítico del enlace serie exige puerto nativo o FTDI genuino;</text>
<text x="600" y="748" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#57534a">la máquina virtual nunca debe tener acceso a Internet ni compartir red con ofimática.</text>
<text x="600" y="788" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#8b8577">ukrabot.cl · Blog de Ingeniería Robótica</text>
</svg>
