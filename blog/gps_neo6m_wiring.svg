<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Diagrama de conexión del módulo GPS u-blox NEO-6M a un Arduino Uno por UART">
  <rect width="1200" height="820" fill="#f6f4ee"/>
  <text x="600" y="60" text-anchor="middle" fill="#1e1b15" font-family="Georgia, serif" font-size="36">Conexión del Módulo GPS NEO-6M a Arduino Uno</text>

  <!-- Modulo GPS -->
  <g transform="translate(140 130)">
    <rect x="0" y="0" width="340" height="330" rx="16" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <rect x="95" y="20" width="150" height="150" rx="8" fill="#1a1a1a"/>
    <path d="M 125 95 L 215 95 M 170 50 L 170 140" stroke="#e4c07a" stroke-width="5"/>
    <circle cx="170" cy="95" r="20" fill="none" stroke="#7fd1c8" stroke-width="3"/>
    <text x="170" y="210" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">u-blox NEO-6M</text>
    <text x="170" y="240" text-anchor="middle" fill="#57534a" font-family="Inter, Arial, sans-serif" font-size="19">Antena cerámica integrada</text>
    <g font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">
      <rect x="30" y="280" width="80" height="38" rx="6" fill="#b04a3a"/><text x="70" y="306" text-anchor="middle" fill="#fff">VCC</text>
      <rect x="130" y="280" width="80" height="38" rx="6" fill="#3a3a3a"/><text x="170" y="306" text-anchor="middle" fill="#fff">GND</text>
      <rect x="230" y="280" width="80" height="38" rx="6" fill="#a97b23"/><text x="270" y="306" text-anchor="middle" fill="#fff">TX</text>
    </g>
  </g>

  <!-- Arduino Uno -->
  <g transform="translate(640 130)">
    <rect x="0" y="0" width="400" height="330" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <rect x="0" y="0" width="400" height="52" rx="14" fill="#2f6fb0"/>
    <text x="200" y="34" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600">Arduino Uno</text>
    <g font-family="Inter, Arial, sans-serif" font-size="20" fill="#1e1b15">
      <text x="30" y="110">5V</text>
      <text x="30" y="160">GND</text>
      <text x="30" y="210">D3 (RX → TX GPS)</text>
      <text x="30" y="260">D2 (TX → RX GPS)</text>
    </g>
    <g fill="#e8e2d4">
      <rect x="290" y="90" width="70" height="16" rx="3"/>
      <rect x="290" y="140" width="70" height="16" rx="3"/>
      <rect x="290" y="190" width="70" height="16" rx="3"/>
      <rect x="290" y="240" width="70" height="16" rx="3"/>
    </g>
  </g>

  <!-- Cables -->
  <g stroke-linecap="round" fill="none">
    <path d="M 150 340 C 260 340 260 200 640 200" stroke="#b04a3a" stroke-width="7"/>
    <path d="M 170 340 C 300 340 300 250 640 250" stroke="#3a3a3a" stroke-width="7"/>
    <path d="M 310 310 C 430 310 430 300 640 300" stroke="#a97b23" stroke-width="7"/>
    <path d="M 330 130 C 480 130 480 360 790 360" stroke="#2f6fb0" stroke-width="7"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="20" fill="#57534a">
    <text x="330" y="170">VCC → 5V</text>
    <text x="330" y="235">GND → GND</text>
    <text x="330" y="290">TX → D3 (SoftwareSerial RX)</text>
    <text x="500" y="350">RX del módulo → D2 (SoftwareSerial TX)</text>
  </g>

  <!-- Nota de salida -->
  <g transform="translate(140 560)">
    <rect x="0" y="0" width="900" height="170" rx="14" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
    <text x="450" y="42" text-anchor="middle" fill="#1e1b15" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Salidas útiles del módulo</text>
    <g font-family="Inter, Arial, sans-serif" font-size="19" fill="#57534a">
      <circle cx="60" cy="95" r="15" fill="#2f6fb0"/><text x="90" y="102">UART (TX/RX): tramas NMEA a 9.600 baud por defecto</text>
      <circle cx="60" cy="140" r="15" fill="#a97b23"/><text x="90" y="147">1PPS: pulso de 100 ms por segundo para sincronización de tiempo</text>
    </g>
  </g>

  <text x="600" y="790" text-anchor="middle" fill="#8b8577" font-family="Inter, Arial, sans-serif" font-size="18">SoftwareSerial en 9600 baud es suficiente: las tramas NMEA del NEO-6M se reciben sin problema a esa velocidad.</text>
</svg>
