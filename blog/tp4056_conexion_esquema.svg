<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="Esquema de conexión del módulo TP4056 con protección: entrada USB de 5 voltios, celda de litio en los terminales de batería, carga conectada a los terminales de salida y resistencia de programación de corriente">
<rect width="1200" height="820" fill="#f6f4ee"/>
<text x="600" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="35" fill="#1e1b15">Conexión correcta del módulo TP4056 con protección</text>
<text x="600" y="88" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#57534a">La carga va siempre en OUT, nunca en paralelo con la celda</text>

<rect x="55" y="150" width="200" height="150" rx="12" fill="#ffffff" stroke="#c9c4b8" stroke-width="3"/>
<text x="155" y="188" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#1e1b15" font-weight="bold">Entrada 5 V</text>
<rect x="90" y="205" width="130" height="52" rx="6" fill="#23201b"/>
<rect x="110" y="220" width="90" height="22" rx="3" fill="#8b8577"/>
<text x="155" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#57534a">USB-C o pines IN</text>

<rect x="360" y="130" width="480" height="330" rx="16" fill="#ffffff" stroke="#a97b23" stroke-width="4"/>
<text x="600" y="170" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" fill="#1e1b15" font-weight="bold">Módulo TP4056 con protección</text>

<rect x="400" y="195" width="150" height="90" rx="8" fill="#23201b" stroke="#8b8577" stroke-width="2"/>
<text x="475" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e4c07a" font-weight="bold">TP4056</text>
<text x="475" y="256" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#c9c4b8">cargador CC/CV</text>
<text x="475" y="274" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#c9c4b8">4,2 V ±1,5 %</text>

<rect x="575" y="195" width="110" height="90" rx="8" fill="#3a352c" stroke="#8b8577" stroke-width="2"/>
<text x="630" y="228" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#e4c07a" font-weight="bold">DW01A</text>
<text x="630" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#c9c4b8">supervisor</text>
<text x="630" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#c9c4b8">2,4 V / 4,3 V</text>

<rect x="705" y="195" width="105" height="90" rx="8" fill="#3a352c" stroke="#8b8577" stroke-width="2"/>
<text x="757" y="228" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#e4c07a" font-weight="bold">FS8205A</text>
<text x="757" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#c9c4b8">MOSFET dual</text>
<text x="757" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#c9c4b8">corte de salida</text>

<rect x="400" y="305" width="410" height="60" rx="8" fill="#faf5ea" stroke="#a97b23" stroke-width="2"/>
<text x="605" y="330" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#1e1b15" font-weight="bold">R3 (Rprog) — fija la corriente de carga</text>
<text x="605" y="354" text-anchor="middle" font-family="monospace, monospace" font-size="15" fill="#a97b23">I (A) = 1200 / R (Ω)   ·   1,2 kΩ → 1 A   ·   2,4 kΩ → 500 mA</text>

<text x="600" y="400" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#3f7a2e" font-weight="bold">Tres chips y seis terminales = módulo con protección</text>
<text x="600" y="428" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#57534a">Si solo ves IN y BAT, no tiene protección: no lo uses con una celda desnuda</text>

<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#3a3a3a"/>
</marker>
</defs>
<line x1="255" y1="225" x2="360" y2="225" stroke="#3a3a3a" stroke-width="4" marker-end="url(#ar)"/>
<text x="307" y="212" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#57534a">IN+ / IN−</text>

<rect x="945" y="150" width="200" height="150" rx="12" fill="#ffffff" stroke="#3f7a2e" stroke-width="3"/>
<text x="1045" y="188" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#1e1b15" font-weight="bold">Celda 1S</text>
<rect x="985" y="205" width="120" height="52" rx="8" fill="#3f7a2e"/>
<text x="1045" y="238" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#ffffff">3,7 V nominal</text>
<text x="1045" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#57534a">Li-ion o LiPo</text>
<line x1="840" y1="225" x2="945" y2="225" stroke="#3f7a2e" stroke-width="4" marker-end="url(#ar)"/>
<text x="892" y="212" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#3f7a2e">BAT+ / BAT−</text>

<rect x="945" y="340" width="200" height="150" rx="12" fill="#ffffff" stroke="#2f6fb0" stroke-width="3"/>
<text x="1045" y="378" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" fill="#1e1b15" font-weight="bold">Tu circuito</text>
<rect x="985" y="395" width="120" height="52" rx="8" fill="#2f6fb0"/>
<text x="1045" y="428" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff">MCU · sensores</text>
<text x="1045" y="472" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#2f6fb0" font-weight="bold">protegido</text>
<line x1="840" y1="415" x2="945" y2="415" stroke="#2f6fb0" stroke-width="4" marker-end="url(#ar)"/>
<text x="892" y="402" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#2f6fb0">OUT+ / OUT−</text>

<rect x="55" y="530" width="1090" height="115" rx="14" fill="#fdf1ef" stroke="#b2281e" stroke-width="3"/>
<text x="600" y="568" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#7a1c14" font-weight="bold">El error que anula toda la protección</text>
<text x="600" y="600" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#b2281e">Conectar el circuito directamente a la celda o a BAT+ / BAT− puentea los MOSFET del FS8205A.</text>
<text x="600" y="626" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#b2281e">Sin sobredescarga, sin sobrecorriente y sin protección de cortocircuito: como si no la tuviera.</text>

<rect x="55" y="670" width="530" height="90" rx="12" fill="#ffffff" stroke="#a97b23" stroke-width="3"/>
<text x="320" y="702" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#1e1b15" font-weight="bold">Disipación en el chip</text>
<text x="320" y="730" text-anchor="middle" font-family="monospace, monospace" font-size="15" fill="#57534a">P = (Vin − Vbat) × I</text>
<text x="320" y="752" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#8b8577">5 V, 3,2 V, 1 A → 1,8 W: entra en limitación térmica</text>

<rect x="615" y="670" width="530" height="90" rx="12" fill="#ffffff" stroke="#3f7a2e" stroke-width="3"/>
<text x="880" y="702" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#1e1b15" font-weight="bold">Corriente recomendada</text>
<text x="880" y="730" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#57534a">Entre 0,5 C y 1 C de la capacidad de la celda</text>
<text x="880" y="752" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#8b8577">Celda de 400 mAh a 1 A = 2,5 C: cambia la resistencia</text>

<text x="600" y="798" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#8b8577">ukrabot.cl · Blog de Ingeniería Robótica</text>
</svg>
